<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="author" content="Yoon">
<title>CS·AI 학습 노트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root{
  --bg:#ffffff; --panel:#ffffff; --fg:#18181b; --muted:#71717a; --line:#e4e4e7; --line2:#d4d4d8;
  --code-bg:#f4f4f5; --mark:#fde68a; --ok:#15803d; --bad:#b91c1c; --sc:#3a8fc4;
  --k:#a626a4; --s:#50a14f; --n:#b76b01; --c:#8a8f98; --f:#4078f2;
  --sans:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f0f10; --panel:#161618; --fg:#ededed; --muted:#a1a1aa; --line:#27272a; --line2:#3f3f46;
    --code-bg:#1c1c1f; --sc:#8ccbef; --mark:#7c5e10; --ok:#4ade80; --bad:#f87171;
    --k:#c678dd; --s:#98c379; --n:#d19a66; --c:#7f8794; --f:#61afef;
  }
}
:root[data-theme="dark"]{
  --bg:#0f0f10; --panel:#161618; --fg:#ededed; --muted:#a1a1aa; --line:#27272a; --line2:#3f3f46;
  --code-bg:#1c1c1f; --sc:#8ccbef; --mark:#7c5e10; --ok:#4ade80; --bad:#f87171;
  --k:#c678dd; --s:#98c379; --n:#d19a66; --c:#7f8794; --f:#61afef;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 var(--sans);word-break:keep-all;overflow-wrap:anywhere}
a{color:inherit}
button{font:inherit;color:inherit}
.sc-soft{background:color-mix(in srgb,var(--sc) 12%,transparent)}

/* 상단 바 */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.top .brand{font-weight:700;text-decoration:none;white-space:nowrap}
.top input[type=search]{flex:1;min-width:0;max-width:420px;margin-left:auto;padding:7px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-size:14px}
.ibtn{border:1px solid var(--line2);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
.ibtn:hover{border-color:var(--muted)}
a.ibtn{color:inherit;text-decoration:none}
.home-btn{display:none}
#loginBtn{max-width:9em;overflow:hidden;text-overflow:ellipsis}
.acct-menu{position:fixed;z-index:30;display:flex;flex-direction:column;min-width:8em;padding:4px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.acct-menu[hidden]{display:none}
.acct-menu button{border:0;background:none;padding:8px 12px;text-align:left;border-radius:6px;cursor:pointer}
.acct-menu button:hover{background:var(--code-bg)}

/* 레이아웃 */
.layout{display:flex;align-items:flex-start}
#sidebar{position:sticky;top:53px;width:250px;flex:none;height:calc(100vh - 53px);overflow-y:auto;padding:14px 10px 40px;border-right:1px solid var(--line);font-size:14px;line-height:1.5}
#sidebar .nav-top a{display:block;padding:6px 10px;border-radius:6px;text-decoration:none}
#sidebar a:hover{background:var(--code-bg)}
#sidebar a.active{background:color-mix(in srgb,var(--sc) 15%,transparent);font-weight:600}
.nav-group{margin:18px 10px 6px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
#sidebar details{margin:2px 0}
#sidebar summary{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;cursor:pointer;list-style:none}
#sidebar summary::-webkit-details-marker{display:none}
#sidebar summary:hover{background:var(--code-bg)}
#sidebar summary .cnt{margin-left:auto;white-space:nowrap;color:var(--muted);font-size:12px}
#sidebar ul{list-style:none;margin:2px 0 6px;padding:0 0 0 18px}
#sidebar li a,#sidebar li.stub{display:flex;gap:8px;align-items:center;padding:4px 8px;border-radius:6px;text-decoration:none}
#sidebar li.stub{color:var(--muted);opacity:.6}
#sidebar li.grp{padding:8px 8px 2px;font-size:12px;font-weight:600;color:var(--muted)}
.grp-h{margin:1.4em 0 .8em;font-size:.95rem;color:var(--muted)}
.st{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line2);flex:none}
.st1{border-color:var(--sc);background:color-mix(in srgb,var(--sc) 40%,transparent)}
.st2{border-color:var(--sc);background:var(--sc)}

main{flex:1;min-width:0;padding:32px 24px 80px}
#view{max-width:780px;margin:0 auto}
h1{font-size:1.9rem;line-height:1.35;margin:.2em 0 .5em}
h2{font-size:1.25rem;margin:2.2em 0 .7em;padding-bottom:.3em;border-bottom:1px solid var(--line)}
h3{font-size:1.05rem;margin:1.6em 0 .5em}
h4{font-size:1rem;margin:1.3em 0 .3em}
p,li{margin:.6em 0}
.lead{color:var(--muted);font-size:1.05rem}
.desc{margin:.2em 0 1.2em;padding-left:1.1em;color:var(--muted)} .desc li{margin:.15em 0}
.crumb{font-size:14px;color:var(--sc);font-weight:600}
.crumb a{text-decoration:none}
.tag{display:inline-block;vertical-align:middle;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;border:1px solid var(--sc);color:var(--sc);margin-left:6px}
.tag.stub{border-color:var(--line2);color:var(--muted)}
.summary{border:1px solid var(--line);background:var(--code-bg);padding:12px 16px 12px 34px;border-radius:10px;font-weight:500}
.summary li{margin:.2em 0}
.box{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:14px 18px}
.analogy{border:1px dashed var(--line2);border-radius:10px;padding:4px 18px 10px;background:var(--panel)}
.analogy h2{border:0;margin-top:.8em}
code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);padding:.1em .35em;border-radius:4px}
pre{position:relative;margin:1em 0;background:var(--code-bg);border:1px solid var(--line);border-radius:10px;overflow:auto}
pre code{display:block;padding:16px 18px;background:none;font-size:13.5px;line-height:1.65;white-space:pre}
.copy{position:absolute;top:8px;right:8px;font-size:12px;padding:2px 8px;border:1px solid var(--line2);border-radius:6px;background:var(--panel);cursor:pointer;opacity:.75}
.copy:hover{opacity:1}
.hljs-keyword,.hljs-meta{color:var(--k)} .hljs-string{color:var(--s)} .hljs-number,.hljs-literal{color:var(--n)}
.hljs-comment{color:var(--c);font-style:italic} .hljs-title,.hljs-built_in{color:var(--f)}
table{border-collapse:collapse;width:100%;margin:1em 0;font-size:14.5px;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--code-bg)}
.math-item{margin:1em 0;padding:4px 16px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.math-block{overflow-x:auto;padding:4px 0}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:2px 0}

/* 도식 */
figure.diagram{margin:1em 0;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);text-align:center}
figure.diagram svg{max-width:100%;height:auto}
figure.diagram figcaption{font-size:14px;color:var(--muted);margin-top:8px}
/* SQL 예제: 쿼리 → 결과 표 */
.sqlx{margin:1.2em 0 1.8em;padding:12px 16px 6px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.sqlx-h{font-weight:600;margin-bottom:4px}
.sqlx-h .pill{margin:0 6px 0 0;color:var(--sc);border-color:var(--sc)}
.sqlx pre{margin:.6em 0}
.sqlx-l{font-size:13px;color:var(--muted);margin:.7em 0 .1em}
.sqlx-n{margin:.7em 0 .6em;font-size:15px}
.sqlx-err{margin:.6em 0;padding:8px 12px;border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);border-radius:8px;background:color-mix(in srgb,var(--bad) 8%,transparent);color:var(--bad);font:13px var(--mono)}
.tbls{display:flex;flex-wrap:wrap;gap:0 18px;align-items:flex-start}
.rtw{max-width:100%;margin:.3em 0 .6em}
.rt-cap{font:600 12.5px var(--mono);color:var(--muted);margin-bottom:2px}
table.rt{width:auto;max-width:100%;margin:0;font-size:13.5px}
table.rt th,table.rt td{padding:4px 10px;white-space:nowrap}
.rt .null{color:var(--muted);font-style:italic;font-size:12px}
.rt td.empty{color:var(--muted);text-align:center}
.diagram text{fill:var(--fg);font:13px var(--sans);text-anchor:middle;dominant-baseline:central}
.diagram text.sm{font-size:11px;fill:var(--muted)}
.diagram text.st{text-anchor:start}
.diagram .n{fill:var(--panel);stroke:var(--muted);stroke-width:1.5}
.diagram .h{fill:color-mix(in srgb,var(--sc) 20%,var(--panel));stroke:var(--sc);stroke-width:2}
.diagram .g{fill:var(--code-bg);stroke:var(--line2);stroke-width:1}
.diagram .e{stroke:var(--muted);stroke-width:1.5;fill:none}
.diagram .a{stroke:var(--muted);stroke-width:1.5;fill:none;marker-end:url(#arr)}
.diagram .he{stroke:var(--sc);stroke-width:2.5;fill:none}
.diagram .ha{stroke:var(--sc);stroke-width:2.5;fill:none;marker-end:url(#arr)}
.diagram .d{stroke-dasharray:5 4}
.diagram .fill{fill:var(--sc);stroke:none}
#arr path{fill:var(--muted)}
.diagram text.en{text-anchor:end}

/* 논문 읽기 */
.paper-meta{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;margin:0 0 1.2em;padding:12px 16px;border:1px solid var(--line);border-radius:10px;font-size:14px;line-height:1.6}
.paper-meta dt{color:var(--muted)} .paper-meta dd{margin:0}
.toc{list-style:none;margin:1.4em 0;padding:10px 16px;border-left:3px solid var(--sc);background:var(--code-bg);border-radius:0 10px 10px 0;font-size:15px}
.toc li{margin:.2em 0;padding-left:3.6em;text-indent:-3.6em}
.toc li:not(.extra)+li.extra{margin-top:.6em}
.paper h2{scroll-margin-top:64px}
.secno{display:inline-block;min-width:3.6em;text-indent:0;color:var(--muted);font-variant-numeric:tabular-nums}
h2 .secno{min-width:0;margin-right:.5em}
.sec-desc{color:var(--muted);font-size:14px}
h2+.sec-desc{margin:-.4em 0 1em}
.toc a{text-decoration:none} .toc a:hover{text-decoration:underline}
.plist .no{font-size:13px;font-weight:700;color:var(--sc);font-variant-numeric:tabular-nums}
@media (max-width:700px){ .paper figure.diagram{padding:10px 6px} }   /* 좁은 화면에선 도식을 화면 너비에 맞춰 줄이고, 여백을 줄여 최대한 크게 */

/* 상태·퀴즈·메모 */
.status-bar{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;margin:4px 0 16px}
.status-bar button{border:0;background:var(--panel);padding:6px 14px;font-size:14px;cursor:pointer;border-right:1px solid var(--line2)}
.status-bar button:last-child{border-right:0}
.status-bar button.on{background:var(--sc);color:var(--bg);font-weight:600}
.page-print{margin:4px 0 16px 8px;vertical-align:top;padding:6px 12px;font-size:14px}
.quiz{margin:1.2em 0;padding:14px 18px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.quiz .q{font-weight:600;margin:0 0 .6em}
.quiz button.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:8px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);cursor:pointer;line-height:1.6}
.quiz button.opt:hover:not(:disabled){border-color:var(--sc)}
.quiz button.opt:disabled{cursor:default}
.quiz button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.quiz button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.quiz .exp{display:none;margin-top:10px;padding:10px 14px;border-radius:8px;background:var(--code-bg);font-size:15px}
.quiz.answered .exp{display:block}
textarea#memo{width:100%;min-height:180px;padding:12px 14px;border:1px solid var(--line2);border-radius:10px;background:var(--panel);color:var(--fg);font:15px/1.7 var(--sans);resize:vertical}
.memo-meta{font-size:13px;color:var(--muted)}
.links li a{font-weight:600}
.pill{font-size:12px;color:var(--muted);border:1px solid var(--line2);border-radius:99px;padding:0 7px;margin-left:4px;white-space:nowrap}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:48px;padding-top:20px;border-top:1px solid var(--line)}
.pager a{flex:1;max-width:48%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;text-decoration:none;font-size:14px;background:var(--panel)}
.pager a:hover{border-color:var(--muted)}
.pager small{display:block;color:var(--muted)}
.pager .next{text-align:right;margin-left:auto}

/* 홈 · 과목 · 진도 */
.bar{display:flex;height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0}
.bar span{background:var(--sc)}
.bar span.doing{background:color-mix(in srgb,var(--sc) 40%,transparent)}
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px 32px;flex-wrap:wrap}
.hero h1{margin:0}
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut{position:relative;width:88px;height:88px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--sc) 0 var(--a),color-mix(in srgb,var(--sc) 35%,var(--bg)) 0 var(--b),var(--line) 0)}
.donut::before{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--bg)}
.donut b{position:relative;font-size:1.15rem;font-variant-numeric:tabular-nums}
.dlegend{list-style:none;padding:0;margin:0;font-size:13px;line-height:1.5;color:var(--muted);font-variant-numeric:tabular-nums}
.dlegend li{margin:2px 0}
.dlegend i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line);margin-right:6px}
.dlegend .k2{background:var(--sc)} .dlegend .k1{background:color-mix(in srgb,var(--sc) 35%,var(--bg))}
.steps{list-style:none;padding:0;margin:1.6em 0}
.steps li{position:relative;margin:0;padding:0 0 22px 46px}
.steps li::before{content:"";position:absolute;left:13px;top:30px;bottom:2px;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps li.s2::before{background:var(--sc)}
.steps .num{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;border:2px solid var(--line2);background:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:700;line-height:1;color:var(--muted)}
.steps .s1 .num{border-color:var(--sc);color:var(--fg)}
.steps .s2 .num{border-color:var(--sc);background:var(--sc);color:var(--bg)}
.steps li.stub{color:var(--muted)}
.steps li.stub .num{border-style:dashed}
.steps .sm{font-size:14px;color:var(--muted);margin-top:2px}
.tlist{list-style:none;padding:0}
.tlist li{padding:12px 0;border-bottom:1px solid var(--line);margin:0}
.tlist li.stub{color:var(--muted)}
.tlist .sm{font-size:14px;color:var(--muted);margin-top:2px}
.legend{font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px;vertical-align:-1px}

.resume{display:block;padding:18px 20px;border:1px solid var(--line);border-radius:12px;text-decoration:none}
.resume:hover{border-color:var(--sc)}
.resume .meta{display:block;font-size:13px;color:var(--muted)}
.resume strong{display:block;font-size:1.2rem;margin:2px 0 4px}
.resume .sm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;color:var(--muted)}
.resume .go{display:inline-block;margin-top:10px;font-size:14px;font-weight:600}

/* 학습 순서 */
#view:has(.home2){max-width:1440px}
/* 홈: PC 3열(이어서·오늘의 문제 | CS 순서 | AI 순서) → 태블릿: 위 1열 + 아래 2열 → 모바일 1열 */
.home2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 40px;align-items:start}
.path-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.path-h .track-meta{margin-left:auto;font-size:14px;color:var(--fg);font-weight:600}
.path-h .track-meta span{color:var(--muted);font-weight:400}
.path-col .steps{margin-top:0}
.path-h .cont{visibility:hidden}
@media (max-width:1199px){ .home2{grid-template-columns:repeat(2,minmax(0,1fr))} .home2>:first-child{grid-column:1/-1} }
@media (max-width:699px){ .home2{grid-template-columns:minmax(0,1fr)} .path-h .cont{visibility:visible} }
.math-item .defs{margin:.4em 0;padding-left:1.3em}
.math-item .defs li{margin:.15em 0}
.track-meta{font-size:14px;font-weight:400;color:var(--muted);margin-left:8px}
.steps .no{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:3px 0 8px}
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.ptile{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;line-height:1.5}
.ptile:hover{border-color:var(--sc)}
.ptile strong{display:block;font-size:14.5px}
.ptile .meta{font-size:12.5px;color:var(--muted)}
.ptile .bar{height:3px;margin:6px 0 0}
.tabs{display:flex;flex-wrap:wrap;gap:0 18px;margin:12px 0;border-bottom:1px solid var(--line)}
.chip{padding:6px 0;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--muted);text-decoration:none;font-size:14px;font-weight:600}
.chip:hover{color:var(--fg)}

/* 문제 풀기 */
.chip.on{color:var(--sc);border-color:var(--sc)}
#deck{max-width:720px;margin-top:20px}
.tabs.sub{margin-top:-6px;border-bottom:0}
.tabs.sub .chip{font-size:13px}
.chip small{font-weight:400;color:var(--muted)}
.quiz.exam .sol-btn{margin-top:8px;padding:4px 12px;font-size:14px}
.quiz.exam .exp .ans{margin:0 0 6px;font-weight:700;color:var(--ok)}
.quiz.exam .exp .ans.bad{color:var(--bad)}
.quiz.exam .exp ol{padding-left:1.4em;margin:.4em 0}
.quiz.exam .exp li{margin:6px 0}
.quiz .q table,.quiz.exam .exp table{font-size:14px;font-weight:400}
.quiz .q code{white-space:normal;overflow-wrap:anywhere}
.quiz .q pre code{white-space:pre;overflow-wrap:normal;font-weight:400}
.deck-meta{font-size:14px;color:var(--muted)}
.sheet-bar{position:sticky;top:53px;z-index:5;display:flex;align-items:center;gap:12px;margin:8px 0;padding:8px 0;background:var(--bg);border-bottom:1px solid var(--line);font-size:14px}
.sheet-bar strong{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-back{text-decoration:none;color:var(--muted)}
.sheet-clock,.sheet-cnt,.sheet-score{font-variant-numeric:tabular-nums;white-space:nowrap}
.sheet-clock{font-weight:700}
.sheet-clock.over{color:var(--bad)}
.sheet-score{font-weight:700;color:var(--sc)}
.sheet-bar .again-btn{padding:5px 14px;font-size:14px}
.sheet-bar .again-btn.warn{background:var(--bad);border-color:var(--bad)}
.sheet-res{display:grid;grid-template-columns:auto 1fr;gap:4px 24px;align-items:center;margin:16px 0;padding:14px 18px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.sheet-res .big{font-size:2rem;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.sheet-res .big small{font-size:1rem;color:var(--muted);font-weight:400}
.sheet-res .sm{font-size:14px;color:var(--muted)}
.by-subj{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr auto;gap:2px 14px;align-items:center;margin-top:8px;font-size:14px}
.by-subj>span:first-child,.by-subj>span:nth-child(3n+1){font-weight:600}
.by-subj>span:nth-child(3n){text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.omr{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.omr a{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line2);border-radius:6px;text-decoration:none;font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.omr a.on{border-color:var(--sc);background:var(--sc);color:var(--bg)}
.omr a.ok{border-color:var(--ok);color:var(--ok)}
.omr a.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad);font-weight:700}
.sheet-q{scroll-margin-top:110px}
.sheet-q .qno{color:var(--sc);font-variant-numeric:tabular-nums}
.sheet-q .q .box{margin:.6em 0;font-weight:400}
.quiz button.mopt{display:block;width:100%;text-align:left;margin:6px 0;padding:8px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);cursor:pointer;line-height:1.6}
.quiz button.mopt:hover:not(:disabled){border-color:var(--sc)}
.quiz button.mopt:disabled{cursor:default}
.quiz button.mopt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.quiz button.mopt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.quiz button.mopt.sel{border-color:var(--sc);background:color-mix(in srgb,var(--sc) 14%,transparent);font-weight:600}
.sheet-q .sol{margin-top:8px}
.sheet-q .sol summary{cursor:pointer;font-size:14px;color:var(--muted)}
.sheet-q .sol .exp{display:block}
.deck-next{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;font-size:14px}
.deck-next button,.again-btn{padding:8px 18px;border:1px solid var(--sc);border-radius:8px;background:var(--sc);color:var(--bg);font-weight:600;cursor:pointer}
.deck-next button.ghost{background:transparent;color:var(--sc);border-color:transparent}
.deck-next button.ghost:hover{border-color:var(--sc)}

/* 검색 */
.result{padding:12px 0;border-bottom:1px solid var(--line)}
.result a{font-weight:600}
.result p{margin:.2em 0;font-size:14px;color:var(--muted)}
mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:3px}


.foot{max-width:780px;margin:64px auto 0;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;z-index:50}
.toast[hidden]{display:none}

const KEY = 'cs-ai-study:v1', THEME_KEY = 'cs-ai-study:theme';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const sumLine = t => esc(strip(String(t.summary || '').replace(/\n/g, ' · ')));   // HTML에 넣으므로 다시 이스케이프
// 인라인 태그(굵게·코드 등)는 공백 없이 지우고, 문단·목록 같은 블록 태그만 공백으로 바꾼다 ("메모리 에" 방지)
const strip = s => String(s ?? '').replace(/<\/?(strong|b|em|i|code|span|a|sub|sup|mark|small)\b[^>]*>/gi, '').replace(/<[^>]+>/g, ' ').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&').replace(/\s+/g, ' ');

function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } }

function cleanState(o) {
  const out = { status: {}, notes: {}, wrong: {}, done: {}, score: {} };
  if (!o || typeof o !== 'object') return out;
  for (const [k, v] of Object.entries(o.status || {})) if ([0, 1, 2].includes(v)) out.status[k] = v;
  for (const [k, v] of Object.entries(o.notes || {})) if (typeof v === 'string') out.notes[k] = v;
  for (const [k, v] of Object.entries(o.wrong || {})) if (v === 1) out.wrong[k] = 1;
  for (const [k, v] of Object.entries(o.done || {})) if (v === 1) out.done[k] = 1;   // 필기 대비에서 푼 문항
  for (const [k, v] of Object.entries(o.score || {})) if (Array.isArray(v) && v.length === 2 && v.every(Number.isInteger)) out.score[k] = v;   // 실전: 회차 id → [최근 점수, 최고 점수]
  return out;
}
let state = (() => { try { return cleanState(JSON.parse(lsGet(KEY))); } catch { return cleanState(null); } })();
const TS_KEY = 'cs-ai-study:updatedAt';   // 마지막 로컬 수정 시각 (클라우드 동기화 비교용)
function save() {
  if (!lsSet(KEY, JSON.stringify(state))) toast('브라우저 저장소를 사용할 수 없습니다. 로그인하면 클라우드에 저장됩니다.');
  lsSet(TS_KEY, String(Date.now()));
  window.cloudSave?.();
}

}

  <ul class="toc">${p.sections.map((sec, k) => `<li class="${sec.no ? '' : 'extra'}"><span class="secno">${sec.no}</span><a href="#/p/${p.id}" data-jump="sec-${k}">${esc(sec.title)}</a> <span class="sec-desc">${esc(sec.desc)}</span></li>`).join('')}</ul>`;
  h += `<div class="paper">` + p.sections.map((sec, k) => `<h2 id="sec-${k}">${sec.no ? `<span class="secno">${sec.no}</span>` : ''}${esc(sec.title)}</h2><p class="sec-desc">${esc(sec.desc)}</p>${sec.body}`).join('') + `</div>`;
  if (p.quiz?.length) h += `<h2>이해도 확인</h2>` + p.quiz.map((q, qi) => quizCard(BY_ID[key], qi, `Q${qi + 1}.`)).join('');
  if (p.links?.length) h += `<h2>연결 개념</h2><ul class="links">` + p.links.map(l => `<li>${topicLink(l.to)}<br><span class="legend" style="font-size:14px">${l.why || ''}</span></li>`).join('') + `</ul>`;
  h += `<h2>내 메모</h2><textarea id="memo" placeholder="읽으면서 떠오른 생각, 헷갈린 점, 더 찾아볼 것을 적어 두기.">${esc(state.notes[key] || '')}</textarea>
  <div class="memo-meta" id="memoMeta">자동 저장됩니다.</div>
  <nav class="pager">${older ? `<a href="#/p/${older.id}"><small>← 이전 논문</small>${esc(older.short)}</a>` : ''}${newer ? `<a class="next" href="#/p/${newer.id}"><small>다음 논문 →</small>${esc(newer.short)}</a>` : ''}</nav>`;
  return h;
}

// 페이지: 학습 순서
function pathSteps(p) {
  let h = `<ol class="steps">`;
  p.stages.forEach((st, k) => {
    const sp = prog(st.subjects.flatMap(id => TOPICS[id] || []));
    const cls = sp.total && sp.done === sp.total ? 's2' : sp.done + sp.doing ? 's1' : '';
    h += `<li class="${cls}"><span class="num">${cls === 's2' ? '✓' : k + 1}</span><div class="no">${k + 1}단계</div><div class="ptiles">`;
    for (const id of st.subjects) { const s = SUBJ[id], ssp = prog(TOPICS[id] || []);
      h += `<a class="ptile" href="#/s/${id}"><strong>${s.no}. ${esc(s.name)}</strong><span class="meta">${ssp.total ? `${ssp.pct}% · ${ssp.done}/${ssp.total}` : '준비 중'}</span>${ssp.total ? bar(ssp) : ''}</a>`; }
    h += `</div></li>`;
  });
  return h + `</ol>`;
}

// 페이지: 검색
function textOf(t) {
  if (t._text === undefined) {
    t._raw = [t.title, strip(t.summary), strip(t.body), strip(t.analogy), (t.math || []).map(m => strip(m.explain)).join(' '), t.code || ''].join(' \n ');
    t._text = t._raw.toLowerCase();
  }
  return t._text;
}
function renderSearch(q) {
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!terms.length) return `<h1>검색</h1><p class="lead">상단 검색창에 키워드를 입력하세요. 여러 단어는 모두 포함하는 주제를 찾습니다.</p>`;
  const hits = ALL.filter(t => terms.every(w => textOf(t).includes(w)))
    .sort((a, b) => terms.some(w => b.title.toLowerCase().includes(w)) - terms.some(w => a.title.toLowerCase().includes(w)));
  const hl = s => { let e = esc(s); for (const w of terms) e = e.replace(new RegExp(esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`); return e; };
  let h = `<h1>"${esc(q)}" 검색 결과 ${hits.length}건</h1>`;
  for (const t of hits) {
    const raw = t._raw, i = Math.max(0, t._text.indexOf(terms[0]));
    const snip = (i > 40 ? '…' : '') + raw.slice(Math.max(0, i - 40), i + 110).replace(/\s+/g, ' ') + '…';
    h += `<div class="result">${t.ready ? `<a href="#/t/${t.id}">${hl(t.title)}</a>` : `${hl(t.title)} <span class="tag stub">준비 중</span>`} <span class="pill">${esc(SUBJ[t.subject].short)}</span>${t.ready ? `<p>${hl(snip)}</p>` : ''}</div>`;
  }
  return h;
}

// 라우터
// 페이지: 퀴즈 풀이 — 각 주제의 quiz를 섞어 한 장씩
let deck = [], deckPos = 0, deckRes = [], deckFilter = '';   // deckRes[위치] = 맞혔는지 (이전으로 돌아가 다시 풀면 덮어씀)
function renderPractice(f) {
  const all = READY.flatMap(t => (t.quiz || []).map((_, qi) => [t, qi]));
  const wrong = all.filter(([t, qi]) => state.wrong[t.id + ':' + qi]);
  deck = shuffle(f === 'wrong' ? wrong : all.filter(([t]) => !f || t.subject === f));
  deckPos = 0; deckRes = []; deckFilter = f;
  const chips = [['', `전체 ${all.length}`], ...SUBJECTS.filter(s => all.some(([t]) => t.subject === s.id)).map(s => [s.id, s.short]), ['wrong', `오답 ${wrong.length}`]];
  return `<h1>퀴즈 풀이</h1>
  <div class="tabs">${chips.map(([id, l]) => `<a class="chip${id === f ? ' on' : ''}" href="#/practice/${id}">${esc(l)}</a>`).join('')}</div>
  <div id="deck">${deckCard()}</div>`;
}
function deckCard() {
  if (!deck.length) return `<p class="lead">${deckFilter === 'wrong' ? '오답이 없습니다.' : '문항이 없습니다.'}</p>`;
  if (deckPos >= deck.length) {
    const right = deckRes.filter(Boolean).length, skipped = deck.length - Object.keys(deckRes).length;
    return `<div class="quiz"><p class="q">끝! ${deck.length}문제 중 ${right}개 정답${skipped ? ` · 건너뜀 ${skipped}` : ''}</p><button class="again-btn">다시 섞어 풀기</button></div>`;
  }
  const [t, qi] = deck[deckPos];
  return `<div class="deck-meta">${deckPos + 1} / ${deck.length} · ${esc(SUBJ[t.subject].short)}</div>` + quizCard(t, qi, '')
    + `<div class="deck-next">${deckPos ? '<button class="ghost prev-btn">← 이전</button>' : '<span></span>'}<button class="ghost next-btn skip-btn">건너뛰기 →</button></div>`;
}

// 페이지: 필기 대비 — 과목·유형을 고르면 안 푼 문제만 하나씩 (오답 탭은 틀린 문제만). 푼 기록: state.done
const examSkip = new Set(), examPassed = new Set();   // 이번에 지나간 문항 / 그중 안 풀고 건너뛴 것 (남은 게 없으면 다시 나옴)
let examScope = '', examKeys = [], examHist = [], examAt = -1, examStay = false;   // examHist: 이번에 본 문항 순서, examAt: 지금 보는 위치
function renderExam(f, ty) {
  if (f + '/' + ty !== examScope) { examSkip.clear(); examPassed.clear(); examHist = []; examAt = -1; examScope = f + '/' + ty; }
  const key = ([t, qi]) => t.id + ':' + qi, typeOf = ([t, qi]) => t.quiz[qi].type;
  const all = [...EXAM_T, ...PAST_T].flatMap(t => t.quiz.map((_, qi) => [t, qi]));
  const pool = f === 'wrong' ? all.filter(x => state.wrong[key(x)]) : all.filter(([t]) => t.subject === f);
  let h = examTabs(f, all.filter(x => state.wrong[key(x)]).length);
  if (f !== 'wrong') {
    const left = xs => xs.filter(x => !state.done[key(x)]).length;
    const types = [['', '전체', pool], ...[...new Set(pool.map(typeOf))].map(y => [y, y, pool.filter(x => typeOf(x) === y)])];
    h += `<div class="tabs sub">${types.map(([id, l, xs]) => `<a class="chip${id === ty ? ' on' : ''}" href="#/exam/${f}${id ? '/' + encodeURIComponent(id) : ''}">${esc(l)} <small>${left(xs)}</small></a>`).join('')}</div>`;
  }
  const scope = ty ? pool.filter(x => typeOf(x) === ty) : pool;
  let todo = scope.filter(x => !examSkip.has(key(x)) && (f === 'wrong' || !state.done[key(x)]));
  if (!todo.length && examPassed.size) { examPassed.forEach(k => examSkip.delete(k)); examPassed.clear(); return renderExam(f, ty); }   // 건너뛴 문제 다시
  examKeys = scope.map(key);
  const cur = examHist[examAt];
  if (cur && (examStay || examAt < examHist.length - 1 || todo.some(x => key(x) === cur))) todo = [BY_KEY(cur), ...todo.filter(x => key(x) !== cur)];   // 이전으로 돌아왔거나 아직 안 푼 문항이면 그대로
  else if (todo.length) { examHist.push(key(todo[0])); examAt = examHist.length - 1; }
  examStay = false;
  if (!todo.length) return h + (f === 'wrong' ? `<p class="lead">${pool.length ? '오답을 한 바퀴 다 풀었습니다. 틀린 문제는 다음에 다시 나옵니다.' : '오답이 없습니다.'}</p>`
    : `<p class="lead">이 범위의 문제를 다 풀었습니다.</p><button class="again-btn exam-reset">처음부터 다시 풀기</button>`);
  const [t, qi] = todo[0], q = t.quiz[qi];
  return h + `<div class="quiz exam" data-t="${t.id}" data-q="${qi}"><div class="deck-meta">${esc(SUBJ[q.s || t.subject].short)} · ${esc(q.type)}${t.past ? ` · ${esc(t.past.title)} ${qi + 1}번` : ''} · 남은 문제 ${todo.length}</div>
    <div class="q">${q.q}</div>
    ${q.options.map((o, oi) => `<button class="opt" data-o="${oi}">${String.fromCharCode(9312 + oi)} ${o}</button>`).join('')}
    <button class="ibtn sol-btn">풀이 보기</button>
    <div class="exp"><p class="ans">정답 ${String.fromCharCode(9312 + q.answer)}</p>${q.explain}${q.fig ? `<figure class="diagram">${q.fig}<figcaption>${q.cap || ''}</figcaption></figure>` : ''}</div>
    <div class="deck-next">${examAt > 0 ? '<button class="ghost exam-prev">← 이전</button>' : '<span></span>'}<button class="ghost exam-next">${examAt < examHist.length - 1 ? '다음 →' : '건너뛰기 →'}</button></div></div>`;
}
const examTabs = (f, nWrong) => `<h1>필기 대비</h1>
  <div class="tabs">${[['real', '실전'], ...EXAM_T.map(t => [t.subject, SUBJ[t.subject].short]), ['wrong', `오답 ${nWrong}`]].map(([id, l]) => `<a class="chip${id === f ? ' on' : ''}" href="#/exam/${id}">${esc(l)}</a>`).join('')}</div>`;
const wrongCount = () => [...EXAM_T, ...PAST_T].reduce((n, t) => n + t.quiz.filter((_, qi) => state.wrong[t.id + ':' + qi]).length, 0);

// 실전: 기출 회차나 자작 모의고사를 시험지처럼 한 번에 풀고 제출하면 채점. 푸는 중인 시험지는 페이지를 옮겨도 유지
const MOCK = { id: 'mock', title: '자작 모의고사', sub: '전 과목', min: 20, n: 20 };
let sheet = null;   // { id, title, min, items: [[주제, 순번]…], picks: [], start, end }
function newSheet(id) {
  const p = PAST.find(p => p.id === id);
  if (p) return { id, title: p.title + ' ' + p.sub, min: p.min, items: p.qs.map((_, qi) => [BY_ID['past-' + id], qi]), picks: [], start: Date.now(), end: 0 };
  const per = EXAM_T.map(t => shuffle(t.quiz.map((_, qi) => [t, qi]))), items = [];   // 과목을 돌아가며 한 문항씩 뽑아 고르게
  for (let i = 0; items.length < MOCK.n && per.some(a => a.length); i++) { const a = per[i % per.length]; if (a.length) items.push(a.pop()); }
  return { id: 'mock', title: MOCK.title, min: MOCK.min, items: shuffle(items), picks: [], start: Date.now(), end: 0 };
}
const mmss = sec => { const a = Math.abs(sec); return (sec < 0 ? '+' : '') + String(Math.floor(a / 60)).padStart(2, '0') + ':' + String(a % 60).padStart(2, '0'); };
function sheetClock() {   // 남은 시간. 시간이 지나면 초과 시간을 +로 표시
  const el = $('#sheetClock'); if (!el || !sheet || sheet.end) return;
  const left = sheet.min * 60 - Math.floor((Date.now() - sheet.start) / 1000);
  el.textContent = mmss(left); el.classList.toggle('over', left < 0);
}
setInterval(sheetClock, 1000);

function renderReal(id) {
  let h = examTabs('real', wrongCount());
  if (!id) {
    const rec = k => state.score[k] ? ` · 최근 ${state.score[k][0]}점 · 최고 ${state.score[k][1]}점` : '';
    const row = (k, title, meta) => `<li><a href="#/exam/real/${k}"><strong>${esc(title)}</strong></a>${sheet && sheet.id === k && !sheet.end ? ' <span class="pill">푸는 중</span>' : ''}<div class="sm">${meta}${rec(k)}</div></li>`;
    return h + `<h2>기출</h2><ul class="tlist">${PAST.map(p => row(p.id, p.title + ' ' + p.sub, `${p.qs.length}문항 · ${p.min}분`)).join('')}</ul>
      <h2>모의고사</h2><ul class="tlist">${row('mock', MOCK.title, `${MOCK.sub} ${MOCK.n}문항 · ${MOCK.min}분`)}</ul>`;
  }
  if (!sheet || sheet.id !== id) sheet = newSheet(id);
  const S = sheet, done = !!S.end, n = S.items.length;
  const res = S.items.map(([t, qi], i) => S.picks[i] === t.quiz[qi].answer);
  const right = res.filter(Boolean).length, answered = S.picks.filter(x => x != null).length;
  h += `<div class="sheet-bar"><a href="#/exam/real" class="sheet-back">←</a><strong>${esc(S.title)}</strong>`
    + (done ? `<span class="sheet-score">${Math.round(right / n * 100)}점</span><button class="again-btn sheet-again">다시 풀기</button>`
      : `<span id="sheetClock" class="sheet-clock"></span><span class="sheet-cnt"><b id="sheetCnt">${answered}</b> / ${n}</span><button class="again-btn sheet-submit">제출</button>`) + `</div>`;
  if (done) {   // 과목별 결과
    const by = {};
    S.items.forEach(([t, qi], i) => { const s = t.quiz[qi].s || t.subject; (by[s] ||= [0, 0])[1]++; if (res[i]) by[s][0]++; });
    h += `<div class="sheet-res"><div class="big">${right}<small> / ${n}</small></div><div class="sm">소요 ${mmss(Math.floor((S.end - S.start) / 1000))}</div>
      <div class="by-subj">${SUBJECTS.filter(s => by[s.id]).map(s => { const [r, c] = by[s.id];
        return `<span>${esc(s.short)}</span><div class="bar"><span style="width:${r / c * 100}%"></span></div><span>${r} / ${c}</span>`; }).join('')}</div></div>`;
  }
  h += `<div class="omr">${S.items.map((_, i) => `<a href="#" data-jump="sq-${i + 1}" class="${done ? (res[i] ? 'ok' : 'no') : S.picks[i] != null ? 'on' : ''}">${i + 1}</a>`).join('')}</div>`;
  return h + S.items.map(([t, qi], i) => { const q = t.quiz[qi], pick = S.picks[i];
    const cls = oi => done ? (oi === q.answer ? ' right' : oi === pick ? ' wrong' : '') : oi === pick ? ' sel' : '';
    return `<div class="quiz sheet-q" id="sq-${i + 1}" data-i="${i}">${done ? `<div class="deck-meta">${res[i] ? '맞음' : pick == null ? '안 풂' : '틀림'} · ${esc(SUBJ[q.s || t.subject].short)} · ${esc(q.type)}</div>` : ''}
      <div class="q"><span class="qno">${i + 1}.</span> ${q.q}</div>
      ${q.options.map((o, oi) => `<button class="mopt${cls(oi)}" data-o="${oi}"${done ? ' disabled' : ''}>${String.fromCharCode(9312 + oi)} ${o}</button>`).join('')}
      ${done ? `<details class="sol"${res[i] ? '' : ' open'}><summary>풀이</summary><div class="exp"><p class="ans">정답 ${String.fromCharCode(9312 + q.answer)}</p>${q.explain}${q.fig ? `<figure class="diagram">${q.fig}<figcaption>${q.cap || ''}</figcaption></figure>` : ''}</div></details>` : ''}</div>`; }).join('');
}
function sheetSubmit() {
  const S = sheet; S.end = Date.now();
  let right = 0;
  S.items.forEach(([t, qi], i) => { const k = t.id + ':' + qi; state.done[k] = 1;
    if (S.picks[i] === t.quiz[qi].answer) { right++; delete state.wrong[k]; } else state.wrong[k] = 1; });
  const sc = Math.round(right / S.items.length * 100);
  state.score[S.id] = [sc, Math.max(sc, state.score[S.id]?.[1] ?? 0)];
  save(); route();
}

const BY_KEY = k => { const i = k.lastIndexOf(':'); return [BY_ID[k.slice(0, i)], +k.slice(i + 1)]; };
function examMove(d) {   // 필기: 이전(-1) / 다음·건너뛰기(+1)
  if (d < 0) { examAt = Math.max(0, examAt - 1); examStay = true; }
  else if (examAt < examHist.length - 1) { examAt++; examStay = true; }
  else { const k = examHist[examAt]; if (!examSkip.has(k)) { examSkip.add(k); examPassed.add(k); } }
  route();
}
function examAnswered(box) {   // 필기 카드: 푼 것으로 기록하고 '다음 문제' 버튼 표시
  const k = box.dataset.t + ':' + box.dataset.q;
  state.done[k] = 1; examSkip.add(k); examPassed.delete(k); save();
  const b = box.querySelector('.exam-next'); b.textContent = '다음 문제 →'; b.classList.remove('ghost'); b.focus();
}

function route() {
  const [, page = '', ...rest] = location.hash.split('/');
  const arg = decodeURIComponent(rest.join('/'));
  const view = $('#view');
  curTopic = curPaper = null;
  view.removeAttribute('style');
  if (page === 't' && BY_ID[arg]?.ready) {
    curTopic = arg;
    view.innerHTML = renderTopic(BY_ID[arg]);
  } else if (page === 'p' && PAPER[arg]) {
    curPaper = arg;
    view.innerHTML = renderPaper(PAPER[arg]);
  } else if (page === 'gong') view.innerHTML = renderGong();
  else if (page === 'papers') view.innerHTML = renderPapers(arg === 'new');
  else if (page === 's' && SUBJ[arg]) view.innerHTML = renderSubject(SUBJ[arg]);
  else if (page === 'practice') view.innerHTML = renderPractice(SUBJ[arg] || arg === 'wrong' ? arg : '');
  else if (page === 'exam') { const [f, ty = ''] = arg.split('/'); view.innerHTML = EXAM[f] || f === 'wrong' ? renderExam(f, ty) : renderReal(PAST.some(p => p.id === ty) || ty === 'mock' ? ty : ''); sheetClock(); }
  else if (page === 'search') { view.innerHTML = renderSearch(arg); if ($('#q').value !== arg && document.activeElement !== $('#q')) $('#q').value = arg; }
  else view.innerHTML = renderHome();
  enhance(view);
  renderSidebar();
  document.body.classList.remove('nav-open');
  if (page === 'gong' && arg) $('#gong-' + arg)?.scrollIntoView();
  else if (page !== 'search') window.scrollTo(0, 0);
  document.title = (curTopic ? BY_ID[curTopic].title + ' · ' : curPaper ? PAPER[curPaper].short + ' 논문 · ' : page === 'papers' ? '논문 읽기 · ' : page === 'gong' ? '공기업 대비 · ' : page === 'practice' ? '퀴즈 풀이 · ' : page === 'exam' ? '필기 대비 · ' : '') + 'CS·AI 학습 노트';
}

function enhance(view) {
  if (window.katex && curTopic) {
    const t = BY_ID[curTopic];
    view.querySelectorAll('.math-block').forEach(el => katex.render(t.math[+el.dataset.k].tex, el, { displayMode: true, throwOnError: false }));
  }
  if (window.renderMathInElement) renderMathInElement(view, {
    delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }], throwOnError: false,
  });
  if (window.hljs) view.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
}

// 이벤트
$('#view').addEventListener('click', e => {
  const sb = e.target.closest('[data-status]');
  if (sb && curTopic) {
    const v = +sb.dataset.status;
    if (v) state.status[curTopic] = v; else delete state.status[curTopic];
    save();
    sb.parentElement.querySelectorAll('button').forEach(b => { const on = b === sb; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    renderSidebar();
    return;
  }
  const opt = e.target.closest('.opt');
  if (opt) {
    const box = opt.closest('.quiz'), t = BY_ID[box.dataset.t], q = t.quiz[+box.dataset.q], pick = +opt.dataset.o;
    const k = t.id + ':' + box.dataset.q;
    if (pick === q.answer) delete state.wrong[k]; else state.wrong[k] = 1;
    save();
    box.querySelectorAll('.opt').forEach(b => { const i = +b.dataset.o; b.disabled = true; if (i === q.answer) b.classList.add('right'); else if (i === pick) b.classList.add('wrong'); });
    box.classList.add('answered'); box.querySelector('.sol-btn')?.remove();
    const ans = box.querySelector('.ans');   // 필기 대비 카드는 정답 줄에 결과 표시
    if (ans) { ans.insertAdjacentText('afterbegin', pick === q.answer ? '맞았습니다 · ' : '틀렸습니다 · '); ans.classList.toggle('bad', pick !== q.answer); }
    else box.querySelector('.exp').insertAdjacentHTML('afterbegin', `<strong>${pick === q.answer ? '정답!' : '오답.'}</strong> `);
    if (box.closest('#deck')) {
      deckRes[deckPos] = pick === q.answer;
      const nb = $('#deck .skip-btn'); nb.textContent = '다음 →'; nb.classList.remove('ghost', 'skip-btn'); nb.focus();
      nb.insertAdjacentHTML('beforebegin', `<span>${topicLink(t.id)}</span>`);
    }
    if (box.matches('.exam')) examAnswered(box);
    return;
  }
  const sol = e.target.closest('.sol-btn');
  if (sol) {
    const box = sol.closest('.quiz'), q = BY_ID[box.dataset.t].quiz[+box.dataset.q];
    box.querySelectorAll('.opt').forEach(b => { b.disabled = true; if (+b.dataset.o === q.answer) b.classList.add('right'); });
    box.classList.add('answered'); sol.remove();
    if (box.matches('.exam')) examAnswered(box);
    return;
  }
  const mo = e.target.closest('.mopt');
  if (mo) {   // 실전 시험지: 답 고르기 (다시 누르면 취소). 제출 전엔 채점하지 않음
    const i = +mo.closest('.sheet-q').dataset.i, o = +mo.dataset.o;
    sheet.picks[i] = sheet.picks[i] === o ? null : o;
    mo.parentElement.querySelectorAll('.mopt').forEach(b => b.classList.toggle('sel', +b.dataset.o === sheet.picks[i]));
    $(`.omr [data-jump="sq-${i + 1}"]`)?.classList.toggle('on', sheet.picks[i] != null);
    const sb = $('.sheet-submit'), cnt = sheet.picks.filter(x => x != null).length;
    $('#sheetCnt').textContent = cnt; sb.textContent = '제출'; sb.classList.remove('warn');
    return;
  }
  const ss = e.target.closest('.sheet-submit');
  if (ss) {   // 안 푼 문항이 있으면 한 번 더 눌러야 제출
    const left = sheet.items.length - sheet.picks.filter(x => x != null).length;
    if (left && !ss.classList.contains('warn')) { ss.textContent = `${left}문항 안 풂 · 제출`; ss.classList.add('warn'); return; }
    return sheetSubmit();
  }
  if (e.target.closest('.sheet-again')) { sheet = newSheet(sheet.id); return route(); }
  if (e.target.closest('.exam-next')) return examMove(1);
  if (e.target.closest('.exam-prev')) return examMove(-1);
  if (e.target.closest('.exam-reset')) { examKeys.forEach(k => delete state.done[k]); examSkip.clear(); save(); return route(); }
  const dn = e.target.closest('.next-btn, .prev-btn');
  if (dn) { deckPos += dn.matches('.prev-btn') ? -1 : 1; const d = $('#deck'); d.innerHTML = deckCard(); enhance(d); d.querySelector('.opt')?.focus(); return; }
  if (e.target.closest('.again-btn')) return route();
  const jump = e.target.closest('[data-jump]');
  if (jump) { e.preventDefault(); document.getElementById(jump.dataset.jump)?.scrollIntoView({ behavior: 'smooth' }); return; }
  const cp = e.target.closest('.copy');
  if (cp) navigator.clipboard?.writeText(cp.nextElementSibling.textContent).then(() => toast('코드를 복사했습니다'), () => toast('복사 실패'));
});

let memoTimer;
$('#view').addEventListener('input', e => {
  if (e.target.id !== 'memo' || !(curTopic || curPaper)) return;
  const id = curTopic || 'p-' + curPaper, v = e.target.value;
  clearTimeout(memoTimer);
  memoTimer = setTimeout(() => {
    if (v.trim()) state.notes[id] = v; else delete state.notes[id];
    save();
    const m = $('#memoMeta'); if (m) m.textContent = '저장됨 · ' + new Date().toLocaleTimeString('ko-KR');
  }, 400);
});

$('#q').addEventListener('input', e => {
  const url = '#/search/' + encodeURIComponent(e.target.value);
  if (location.hash.startsWith('#/search/')) { history.replaceState(null, '', url); route(); } else location.hash = url;
});
const NAV_KEY = 'cs-ai-study:nav-closed';
document.body.classList.toggle('nav-closed', lsGet(NAV_KEY) === '1');
$('#menuBtn').addEventListener('click', () => {
  if (matchMedia('(max-width:900px)').matches) return document.body.classList.toggle('nav-open');
  lsSet(NAV_KEY, document.body.classList.toggle('nav-closed') ? '1' : '0');
});

function applyTheme(t) { if (t) document.documentElement.dataset.theme = t; }
applyTheme(lsGet(THEME_KEY));
$('#themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const t = cur === 'dark' ? 'light' : 'dark';
  applyTheme(t); lsSet(THEME_KEY, t);
});

let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2200); }

document.addEventListener('keydown', e => {   // 퀴즈·필기: ← → 로 이전 / 다음(건너뛰기)
  if (e.target.closest?.('input, textarea, select') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowLeft') $('.exam-prev, #deck .prev-btn')?.click();
  if (e.key === 'ArrowRight') $('.exam-next, #deck .next-btn')?.click();
});
window.addEventListener('hashchange', route);
document.addEventListener('DOMContentLoaded', route);
</script>
<script type="module">
// 구글 로그인 + Firestore(users/{uid}) 동기화. localStorage가 원본이고 클라우드는 사본.
// ponytail: 수정 시각(기기 시계) 기준 최신 우선. 두 기기에서 동시에 고치면 확인창으로 고르게 함.
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, onAuthStateChanged, signInWithPopup, signOut } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';
import { getFirestore, doc, onSnapshot, setDoc } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';

const app = initializeApp({
  apiKey: 'AIzaSyBpoEiiBlaRrRq4retX95CUaIWxmWkpZAI',
  authDomain: 'cs-ai-study.firebaseapp.com',
  projectId: 'cs-ai-study',
  storageBucket: 'cs-ai-study.firebasestorage.app',
  messagingSenderId: '433783031930',
  appId: '1:433783031930:web:5293bf41043b0e365113c3'
});
const auth = getAuth(app), db = getFirestore(app), btn = $('#loginBtn');
let ref = null, unsub = null, syncKey = '', pushTimer, nick = '';
const label = u => nick || u.displayName || u.email.split('@')[0];   // 별명 → 구글 이름 → 이메일 앞부분
const localTs = () => +lsGet(TS_KEY) || 0;
const syncedTs = () => +lsGet(syncKey) || 0;   // 마지막으로 클라우드와 일치했던 시각

function push() {
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => {
    const ts = localTs(), prev = syncedTs();
    lsSet(syncKey, String(ts));
    setDoc(ref, { state: JSON.stringify(state), updatedAt: ts }, { merge: true })   // merge: 별명 필드 보존
      .catch(() => { lsSet(syncKey, String(prev)); toast('클라우드 저장 실패 · 다음 접속 때 다시 올립니다'); });
  }, 1500);
}
window.cloudSave = () => ref && push();

onAuthStateChanged(auth, user => {
  unsub?.(); unsub = ref = null; nick = '';
  btn.textContent = user ? '동기화 중…' : '로그인';
  btn.title = user ? `${user.email} · 클릭: 별명 바꾸기 / 로그아웃` : '구글 로그인으로 기기 간 동기화';
  if (!user) return;
  syncKey = 'cs-ai-study:syncedAt:' + user.uid;
  ref = doc(db, 'users', user.uid);
  unsub = onSnapshot(ref, snap => {
    if (snap.metadata.hasPendingWrites) return;
    const r = snap.data(), R = r?.updatedAt || 0, L = localTs(), S = syncedTs();
    nick = r?.nick || '';
    const takeRemote = R > S && (L <= S ||
      confirm('이 기기와 클라우드 기록이 둘 다 바뀌었습니다.\n\n확인: 클라우드 기록 사용\n취소: 이 기기 기록 사용'));
    if (takeRemote) {
      try { state = cleanState(JSON.parse(r.state)); } catch { return toast('클라우드 기록이 손상되었습니다'); }
      lsSet(KEY, JSON.stringify(state)); lsSet(TS_KEY, String(R)); lsSet(syncKey, String(R));
      route(); toast('클라우드 기록을 불러왔습니다');
    } else if (L !== R) push();
    btn.textContent = label(user);
  }, () => { btn.textContent = '동기화 오류'; toast('클라우드 연결 실패'); });
});

const menu = document.createElement('div');
menu.className = 'acct-menu'; menu.hidden = true;
menu.innerHTML = '<button data-a="nick">별명 바꾸기</button><button data-a="out">로그아웃</button>';
document.body.append(menu);
document.addEventListener('click', e => { if (!menu.contains(e.target) && e.target !== btn) menu.hidden = true; });

btn.addEventListener('click', () => {
  if (!auth.currentUser) return signInWithPopup(auth, new GoogleAuthProvider()).catch(e => toast('로그인 실패: ' + e.code));
  const r = btn.getBoundingClientRect();
  menu.style.top = r.bottom + 4 + 'px';
  menu.style.right = innerWidth - r.right + 'px';
  menu.hidden = !menu.hidden;
});

menu.addEventListener('click', e => {
  const a = e.target.dataset.a, user = auth.currentUser;
  if (!a || !user) return;
  menu.hidden = true;
  if (a === 'out') {
    if (confirm('로그아웃할까요? 이 기기의 기록은 그대로 남습니다.')) signOut(auth);
    return;
  }
  const v = prompt('표시할 별명 (비우면 구글 이름 사용, 최대 20자)', nick);
  if (v === null) return;
  nick = v.trim().slice(0, 20);
  btn.textContent = label(user);
  setDoc(ref, { nick }, { merge: true }).then(() => toast('별명을 저장했습니다'), () => toast('별명 저장 실패'));
});
</script>
