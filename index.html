<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="author" content="Yoon">
<title>CS·AI 학습 노트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root{
  --bg:#ffffff; --panel:#ffffff; --fg:#18181b; --muted:#71717a; --line:#e4e4e7; --line2:#d4d4d8;
  --code-bg:#f4f4f5; --mark:#fde68a; --ok:#15803d; --bad:#b91c1c; --sc:#3a8fc4;
  --k:#a626a4; --s:#50a14f; --n:#b76b01; --c:#8a8f98; --f:#4078f2;
  --sans:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f0f10; --panel:#161618; --fg:#ededed; --muted:#a1a1aa; --line:#27272a; --line2:#3f3f46;
    --code-bg:#1c1c1f; --sc:#8ccbef; --mark:#7c5e10; --ok:#4ade80; --bad:#f87171;
    --k:#c678dd; --s:#98c379; --n:#d19a66; --c:#7f8794; --f:#61afef;
  }
}
:root[data-theme="dark"]{
  --bg:#0f0f10; --panel:#161618; --fg:#ededed; --muted:#a1a1aa; --line:#27272a; --line2:#3f3f46;
  --code-bg:#1c1c1f; --sc:#8ccbef; --mark:#7c5e10; --ok:#4ade80; --bad:#f87171;
  --k:#c678dd; --s:#98c379; --n:#d19a66; --c:#7f8794; --f:#61afef;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 var(--sans);word-break:keep-all;overflow-wrap:anywhere}
a{color:inherit}
button{font:inherit;color:inherit}
.sc-soft{background:color-mix(in srgb,var(--sc) 12%,transparent)}

/* 상단 바 */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.top .brand{font-weight:700;text-decoration:none;white-space:nowrap}
.top input[type=search]{flex:1;min-width:0;max-width:420px;margin-left:auto;padding:7px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-size:14px}
.ibtn{border:1px solid var(--line2);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
.ibtn:hover{border-color:var(--muted)}
a.ibtn{color:inherit;text-decoration:none}
.home-btn{display:none}
#loginBtn{max-width:9em;overflow:hidden;text-overflow:ellipsis}
.acct-menu{position:fixed;z-index:30;display:flex;flex-direction:column;min-width:8em;padding:4px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.acct-menu[hidden]{display:none}
.acct-menu button{border:0;background:none;padding:8px 12px;text-align:left;border-radius:6px;cursor:pointer}
.acct-menu button:hover{background:var(--code-bg)}

/* 레이아웃 */
.layout{display:flex;align-items:flex-start}
#sidebar{position:sticky;top:53px;width:250px;flex:none;height:calc(100vh - 53px);overflow-y:auto;padding:14px 10px 40px;border-right:1px solid var(--line);font-size:14px;line-height:1.5}
#sidebar .nav-top a{display:block;padding:6px 10px;border-radius:6px;text-decoration:none}
#sidebar a:hover{background:var(--code-bg)}
#sidebar a.active{background:color-mix(in srgb,var(--sc) 15%,transparent);font-weight:600}
.nav-group{margin:18px 10px 6px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
#sidebar details{margin:2px 0}
#sidebar summary{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;cursor:pointer;list-style:none}
#sidebar summary::-webkit-details-marker{display:none}
#sidebar summary:hover{background:var(--code-bg)}
#sidebar summary .cnt{margin-left:auto;white-space:nowrap;color:var(--muted);font-size:12px}
#sidebar ul{list-style:none;margin:2px 0 6px;padding:0 0 0 18px}
#sidebar li a,#sidebar li.stub{display:flex;gap:8px;align-items:center;padding:4px 8px;border-radius:6px;text-decoration:none}
#sidebar li.stub{color:var(--muted);opacity:.6}
.st{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line2);flex:none}
.st1{border-color:var(--sc);background:color-mix(in srgb,var(--sc) 40%,transparent)}
.st2{border-color:var(--sc);background:var(--sc)}

main{flex:1;min-width:0;padding:32px 24px 80px}
#view{max-width:780px;margin:0 auto}
h1{font-size:1.9rem;line-height:1.35;margin:.2em 0 .5em}
h2{font-size:1.25rem;margin:2.2em 0 .7em;padding-bottom:.3em;border-bottom:1px solid var(--line)}
h3{font-size:1.05rem;margin:1.6em 0 .5em}
p,li{margin:.6em 0}
.lead{color:var(--muted);font-size:1.05rem}
.desc{margin:.2em 0 1.2em;padding-left:1.1em;color:var(--muted)} .desc li{margin:.15em 0}
.crumb{font-size:14px;color:var(--sc);font-weight:600}
.crumb a{text-decoration:none}
.tag{display:inline-block;vertical-align:middle;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;border:1px solid var(--sc);color:var(--sc);margin-left:6px}
.tag.stub{border-color:var(--line2);color:var(--muted)}
.summary{border:1px solid var(--line);background:var(--code-bg);padding:12px 16px 12px 34px;border-radius:10px;font-weight:500}
.summary li{margin:.2em 0}
.box{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:14px 18px}
.analogy{border:1px dashed var(--line2);border-radius:10px;padding:4px 18px 10px;background:var(--panel)}
.analogy h2{border:0;margin-top:.8em}
code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);padding:.1em .35em;border-radius:4px}
pre{position:relative;margin:1em 0;background:var(--code-bg);border:1px solid var(--line);border-radius:10px;overflow:auto}
pre code{display:block;padding:16px 18px;background:none;font-size:13.5px;line-height:1.65;white-space:pre}
.copy{position:absolute;top:8px;right:8px;font-size:12px;padding:2px 8px;border:1px solid var(--line2);border-radius:6px;background:var(--panel);cursor:pointer;opacity:.75}
.copy:hover{opacity:1}
.hljs-keyword,.hljs-meta{color:var(--k)} .hljs-string{color:var(--s)} .hljs-number,.hljs-literal{color:var(--n)}
.hljs-comment{color:var(--c);font-style:italic} .hljs-title,.hljs-built_in{color:var(--f)}
table{border-collapse:collapse;width:100%;margin:1em 0;font-size:14.5px;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--code-bg)}
.math-item{margin:1em 0;padding:4px 16px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.math-block{overflow-x:auto;padding:4px 0}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:2px 0}

/* 도식 */
figure.diagram{margin:1em 0;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);text-align:center}
figure.diagram svg{max-width:100%;height:auto}
figure.diagram figcaption{font-size:14px;color:var(--muted);margin-top:8px}
.diagram text{fill:var(--fg);font:13px var(--sans);text-anchor:middle;dominant-baseline:central}
.diagram text.sm{font-size:11px;fill:var(--muted)}
.diagram text.st{text-anchor:start}
.diagram .n{fill:var(--panel);stroke:var(--muted);stroke-width:1.5}
.diagram .h{fill:color-mix(in srgb,var(--sc) 20%,var(--panel));stroke:var(--sc);stroke-width:2}
.diagram .g{fill:var(--code-bg);stroke:var(--line2);stroke-width:1}
.diagram .e{stroke:var(--muted);stroke-width:1.5;fill:none}
.diagram .a{stroke:var(--muted);stroke-width:1.5;fill:none;marker-end:url(#arr)}
.diagram .he{stroke:var(--sc);stroke-width:2.5;fill:none}
.diagram .ha{stroke:var(--sc);stroke-width:2.5;fill:none;marker-end:url(#arr)}
.diagram .d{stroke-dasharray:5 4}
.diagram .fill{fill:var(--sc);stroke:none}
#arr path{fill:var(--muted)}

/* 상태·퀴즈·메모 */
.status-bar{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;margin:4px 0 16px}
.status-bar button{border:0;background:var(--panel);padding:6px 14px;font-size:14px;cursor:pointer;border-right:1px solid var(--line2)}
.status-bar button:last-child{border-right:0}
.status-bar button.on{background:var(--sc);color:var(--bg);font-weight:600}
.page-print{margin:4px 0 16px 8px;vertical-align:top;padding:6px 12px;font-size:14px}
.quiz{margin:1.2em 0;padding:14px 18px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.quiz .q{font-weight:600;margin:0 0 .6em}
.quiz button.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:8px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);cursor:pointer;line-height:1.6}
.quiz button.opt:hover:not(:disabled){border-color:var(--sc)}
.quiz button.opt:disabled{cursor:default}
.quiz button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.quiz button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.quiz .exp{display:none;margin-top:10px;padding:10px 14px;border-radius:8px;background:var(--code-bg);font-size:15px}
.quiz.answered .exp{display:block}
textarea#memo{width:100%;min-height:180px;padding:12px 14px;border:1px solid var(--line2);border-radius:10px;background:var(--panel);color:var(--fg);font:15px/1.7 var(--sans);resize:vertical}
.memo-meta{font-size:13px;color:var(--muted)}
.links li a{font-weight:600}
.pill{font-size:12px;color:var(--muted);border:1px solid var(--line2);border-radius:99px;padding:0 7px;margin-left:4px;white-space:nowrap}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:48px;padding-top:20px;border-top:1px solid var(--line)}
.pager a{flex:1;max-width:48%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;text-decoration:none;font-size:14px;background:var(--panel)}
.pager a:hover{border-color:var(--muted)}
.pager small{display:block;color:var(--muted)}
.pager .next{text-align:right;margin-left:auto}

/* 홈 · 과목 · 진도 */
.bar{display:flex;height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0}
.bar span{background:var(--sc)}
.bar span.doing{background:color-mix(in srgb,var(--sc) 40%,transparent)}
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px 32px;flex-wrap:wrap}
.hero h1{margin:0}
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut{position:relative;width:88px;height:88px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--sc) 0 var(--a),color-mix(in srgb,var(--sc) 35%,var(--bg)) 0 var(--b),var(--line) 0)}
.donut::before{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--bg)}
.donut b{position:relative;font-size:1.15rem;font-variant-numeric:tabular-nums}
.dlegend{list-style:none;padding:0;margin:0;font-size:13px;line-height:1.5;color:var(--muted);font-variant-numeric:tabular-nums}
.dlegend li{margin:2px 0}
.dlegend i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line);margin-right:6px}
.dlegend .k2{background:var(--sc)} .dlegend .k1{background:color-mix(in srgb,var(--sc) 35%,var(--bg))}
.steps{list-style:none;padding:0;margin:1.6em 0}
.steps li{position:relative;margin:0;padding:0 0 22px 46px}
.steps li::before{content:"";position:absolute;left:13px;top:30px;bottom:2px;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps li.s2::before{background:var(--sc)}
.steps .num{position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;border:2px solid var(--line2);background:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:700;line-height:1;color:var(--muted)}
.steps .s1 .num{border-color:var(--sc);color:var(--fg)}
.steps .s2 .num{border-color:var(--sc);background:var(--sc);color:var(--bg)}
.steps li.stub{color:var(--muted)}
.steps li.stub .num{border-style:dashed}
.steps .sm{font-size:14px;color:var(--muted);margin-top:2px}
.tlist{list-style:none;padding:0}
.tlist li{padding:12px 0;border-bottom:1px solid var(--line);margin:0}
.tlist li.stub{color:var(--muted)}
.tlist .sm{font-size:14px;color:var(--muted);margin-top:2px}
.legend{font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px;vertical-align:-1px}

.resume{display:block;padding:18px 20px;border:1px solid var(--line);border-radius:12px;text-decoration:none}
.resume:hover{border-color:var(--sc)}
.resume .meta{display:block;font-size:13px;color:var(--muted)}
.resume strong{display:block;font-size:1.2rem;margin:2px 0 4px}
.resume .sm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;color:var(--muted)}
.resume .go{display:inline-block;margin-top:10px;font-size:14px;font-weight:600}

/* 학습 순서 */
#view:has(.home2){max-width:1440px}
/* 홈: PC 3열(이어서·오늘의 문제 | CS 순서 | AI 순서) → 태블릿: 위 1열 + 아래 2열 → 모바일 1열 */
.home2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 40px;align-items:start}
.path-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.path-h .track-meta{margin-left:auto;font-size:14px;color:var(--fg);font-weight:600}
.path-h .track-meta span{color:var(--muted);font-weight:400}
.path-col .steps{margin-top:0}
.path-h .cont{visibility:hidden}
@media (max-width:1199px){ .home2{grid-template-columns:repeat(2,minmax(0,1fr))} .home2>:first-child{grid-column:1/-1} }
@media (max-width:699px){ .home2{grid-template-columns:minmax(0,1fr)} .path-h .cont{visibility:visible} }
.math-item .defs{margin:.4em 0;padding-left:1.3em}
.math-item .defs li{margin:.15em 0}
.track-meta{font-size:14px;font-weight:400;color:var(--muted);margin-left:8px}
.steps .no{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:3px 0 8px}
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.ptile{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;line-height:1.5}
.ptile:hover{border-color:var(--sc)}
.ptile strong{display:block;font-size:14.5px}
.ptile .meta{font-size:12.5px;color:var(--muted)}
.ptile .bar{height:3px;margin:6px 0 0}
.chip{display:inline-block;margin:4px 6px 4px 0;padding:3px 10px;border-radius:99px;border:1px solid var(--sc);color:var(--sc);text-decoration:none;font-size:14px;font-weight:600}

/* 문제 풀기 */
.chip.on{background:var(--sc);color:var(--bg)}
#deck{max-width:720px;margin-top:20px}
.deck-meta{font-size:14px;color:var(--muted)}
.deck-next{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;font-size:14px}
.deck-next button,.again-btn{padding:8px 18px;border:1px solid var(--sc);border-radius:8px;background:var(--sc);color:var(--bg);font-weight:600;cursor:pointer}

/* 검색 */
.result{padding:12px 0;border-bottom:1px solid var(--line)}
.result a{font-weight:600}
.result p{margin:.2em 0;font-size:14px;color:var(--muted)}
mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:3px}


.foot{max-width:780px;margin:64px auto 0;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;z-index:50}
.toast[hidden]{display:none}

@media (min-width:901px){ body.nav-closed #sidebar{display:none} }
@media (max-width:900px){
  #sidebar{position:fixed;left:0;top:53px;z-index:15;background:var(--panel);transform:translateX(-100%);transition:transform .15s}
  body.nav-open #sidebar{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.3)}
  main{padding:24px 16px 64px}
  h1{font-size:1.55rem}
  .top .brand{display:none}
  .home-btn{display:inline-block}
}
@media print{
  :root,:root[data-theme]{--bg:#fff;--panel:#fff;--fg:#000;--muted:#555;--line:#ddd;--line2:#ccc;--code-bg:#f5f5f5;--sc:#3a8fc4;
    --k:#a626a4;--s:#50a14f;--n:#b76b01;--c:#8a8f98;--f:#4078f2}
  .top,#sidebar,.copy,.status-bar,.page-print,.pager,.toast,textarea#memo,.memo-meta{display:none!important}
  main{padding:0} #view{max-width:none}
  pre code{white-space:pre-wrap}
  pre,figure,.box,.quiz,.math-item,table,.ptile,.steps li{break-inside:avoid}
  h2,h3{break-after:avoid}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
</defs></svg>

<header class="top">
  <button class="ibtn" id="menuBtn" aria-label="목차 접기/펼치기" title="목차 접기/펼치기">☰</button>
  <a class="brand" href="#/">CS·AI 학습 노트</a>
  <a class="ibtn home-btn" href="#/" aria-label="홈으로" title="홈으로">홈</a>
  <input type="search" id="q" placeholder="주제·본문 검색" aria-label="검색">
  <button class="ibtn" id="loginBtn" title="구글 로그인으로 기기 간 동기화">로그인</button>
  <button class="ibtn" id="themeBtn" title="라이트/다크 전환">◐</button>
</header>
<div class="layout">
  <nav id="sidebar" aria-label="과목 목차"></nav>
  <main><article id="view"></article>
    <footer class="foot">© 2026 Yoon · <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.ko" target="_blank" rel="license noopener">CC BY-NC-SA 4.0</a> · 출처 표시 후 비영리 목적으로 자유롭게 이용 가능 (코드 예제는 MIT)<br>이 노트는 AI(Claude)의 도움을 받아 작성했으며 오류가 있을 수 있습니다. 중요한 내용은 공식 문서·교재로 확인하세요.</footer></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* =====================================================================
   학습 콘텐츠 데이터
   ---------------------------------------------------------------------
   과목 추가: SUBJECTS에 항목 추가 + TOPICS[과목id] 배열 작성
   주제 객체 형식 (body가 없으면 '준비 중' 주제로 표시됨):
   {
     id:'ds-hash',            // 전역 고유. 링크 대상(links.to)이 됨
     title: '해시 테이블',
     advanced: true,           // 자격증으로 접한 주제 → '심화' 태그
     summary: R`핵심 1
핵심 2`,                  // 개조식: 줄마다 한 항목, 명사형으로 짧게. HTML 가능
     body: R`<p>핵심 설명</p>`,  // HTML. 인라인 수식 $...$, 블록 $$...$$
     analogy: R`비유`,
     diagram: { svg: R`<svg ...>`, caption: '설명' },   // 선택. 클래스: n h g e a he ha d fill sm st
     math: [{ tex: R`\frac{a}{b}`, explain: R`기호 설명` }],   // 선택

<p>알고리즘의 성능을 "몇 초 걸렸다"로 비교하면 컴퓨터·언어·입력이 바뀔 때마다 결론이 달라진다. 그래서 <strong>입력 크기 $n$에 대해 기본 연산 횟수가 어떤 함수 꼴로 늘어나는가</strong>를 본다. 관심사는 절대 시간이 아니라 <em>확장성</em>이다. 데이터가 10배가 되면 시간이 10배인지, 100배인지.</p>
<h3>왜 상수와 낮은 차수 항을 버리는가</h3>
<p>$3n^2 + 100n + 5000$에서 $n=10$이면 상수 5000이 가장 크지만 $n=10^6$이면 $3n^2 = 3\times10^{12}$이 나머지를 압도한다. 점근 표기는 <strong>충분히 큰 $n$</strong>에서의 행동만 본다. 계수 3을 버리는 이유는 그 정도 차이는 CPU나 언어 구현이 바뀌면 달라지는 값이라 알고리즘 고유의 성질이 아니기 때문이다.</p>
<h3>O·Ω·Θ와 최선·평균·최악은 서로 다른 축</h3>
<p>$O$는 상한, $\Omega$는 하한, $\Theta$는 상한과 하한이 같은 꼴(증가율이 정확히 그 함수)임을 뜻한다. 반면 최선/평균/최악은 <em>어떤 입력을 볼지</em>에 대한 선택이다. 그래서 "퀵 정렬은 최악의 경우 $\Theta(n^2)$, 평균 $\Theta(n\log n)$"처럼 두 축을 조합해 말한다. 흔히 "O(n log n) 알고리즘"이라고 할 때는 보통 평균이나 최악 기준의 증가율을 느슨하게 가리킨다.</p>
<h3>로그는 어디서 나오는가</h3>
<p>매 단계 문제 크기를 <strong>일정 비율로 줄이면</strong>(예: 절반) 단계 수는 $\log n$이다. 이진 탐색, 균형 트리의 높이, 병합 정렬의 분할 깊이가 모두 이 구조다. 로그의 밑은 $\log_a n = \log_b n / \log_b a$ 관계로 상수배 차이일 뿐이라 표기에서 생략한다. $n$이 1000배 커져도 $\log_2 n$은 약 10만 늘어난다.</p>
<h3>상각(amortized) 분석</h3>
<p>대부분은 싸고 가끔 비싼 연산은 "한 번의 최악"이 아니라 "연속된 연산 전체의 평균"으로 평가한다. Python <code>list.append</code>는 가끔 전체 복사가 일어나지만 $n$번 수행한 총비용이 $O(n)$이라 상각 $O(1)$이다.</p>

import time

def count_log(n):          # 절반씩 줄이기
    ops = 0
    while n > 1:
        n //= 2
        ops += 1
    return ops

def count_linear(n):
    ops = 0
    for _ in range(n):
        ops += 1
    return ops

def count_quadratic(n):    # 모든 쌍 (i, j), i < j
    ops = 0
    for i in range(n):
        for j in range(i + 1, n):
            ops += 1
    return ops

for n in [10, 100, 1000, 2000]:
    print(f"n={n:5d}  log:{count_log(n):3d}  linear:{count_linear(n):6d}  quad:{count_quadratic(n):8d}")

# 입력을 2배로 늘렸을 때 실제 시간이 몇 배가 되는가?
def ratio(f, n):
    t0 = time.perf_counter(); f(n)
    t1 = time.perf_counter(); f(2 * n)
    t2 = time.perf_counter()
    return (t2 - t1) / (t1 - t0)

print("linear    ×", round(ratio(count_linear, 1_000_000), 1))   # 약 2
print("quadratic ×", round(ratio(count_quadratic, 1500), 1))      # 약 4

      body: R`
<p>배열의 핵심은 <strong>주소 계산</strong>이다. 각 칸의 크기가 같고 연속되어 있으므로 $i$번째 칸의 주소는 <code>시작 주소 + i × 칸 크기</code> 한 번의 계산으로 나온다. 그래서 0번째든 100만 번째든 접근 시간이 같다(임의 접근, random access).</p>
<p>대가는 <strong>중간 삽입·삭제</strong>다. 연속성을 유지하려면 그 뒤의 원소를 모두 한 칸씩 밀거나 당겨야 하므로 $O(n)$이다. 맨 끝에서의 추가·삭제만 싸다.</p>
<h3>동적 배열: 크기가 자라는 배열</h3>
<p>고정 크기 배열에 원소가 꽉 차면, 더 큰 배열을 새로 할당하고 전부 복사해야 한다. 이때 <strong>얼마나 크게</strong> 늘리느냐가 성능을 결정한다.</p>
<ul>
<li><strong>일정 비율(예: 2배)로 늘리면</strong>: 복사 비용 합이 $1+2+4+\cdots+n < 2n$이라 append $n$번의 총비용이 $O(n)$, 즉 <strong>상각 $O(1)$</strong>.</li>
<li><strong>일정량(예: +10)씩 늘리면</strong>: 복사가 $n/10$번 일어나고 매번 길이가 늘어 총비용 $O(n^2)$.</li>
</ul>
<p>CPython의 list는 비율 방식으로 여유 공간을 미리 확보한다(배율은 2배보다 작고, 세부 공식은 버전마다 다르다). 비율이 1보다 크기만 하면 상각 $O(1)$은 유지된다.</p>
<h3>Python list는 '값'이 아니라 '참조'의 배열</h3>

<h3>트레이드오프</h3>

      code: R`
class Node:
    def __init__(self, val, next=None):
        self.val, self.next = val, next

def from_list(xs):
    head = None
    for x in reversed(xs):
        head = Node(x, head)
    return head

def to_list(head):
    out = []
    while head:
        out.append(head.val)
        head = head.next
    return out

def insert_after(node, val):      # O(1): 포인터만 바꾼다
    node.next = Node(val, node.next)

def reverse(head):                # O(n) 시간, O(1) 추가 공간
    prev, cur = None, head
    while cur:
        nxt = cur.next            # 1) 다음 노드를 잃기 전에 저장
        cur.next = prev           # 2) 방향 뒤집기
        prev, cur = cur, nxt      # 3) 한 칸 전진
    return prev

head = from_list([3, 7, 9])
insert_after(head, 5)
print(to_list(head))              # [3, 5, 7, 9]
print(to_list(reverse(head)))     # [9, 7, 5, 3]

<p>스택과 큐는 구현이 아니라 <strong>인터페이스(추상 자료형, ADT)</strong>다. "어떤 연산이 있고 어떤 순서로 나오는가"만 정한다. 같은 스택을 배열로도, 연결 리스트로도 만들 수 있다.</p>
<h3>스택 = 가장 최근 것부터 처리</h3>
<p>스택이 자연스러운 상황은 <strong>중첩 구조</strong>다. 괄호 <code>( [ { } ] )</code>는 가장 나중에 연 것을 가장 먼저 닫아야 하고, 함수 A가 B를, B가 C를 호출하면 C가 먼저 끝나야 B로 돌아갈 수 있다. 그래서 프로그램 실행 시 함수 호출 정보(지역 변수, 돌아갈 위치)는 <strong>콜 스택</strong>에 쌓인다. 재귀 함수는 이 콜 스택을 암묵적으로 쓰는 것이고, 반복문으로 바꾸려면 명시적 스택이 필요하다. Python은 기본 재귀 깊이 한도(<code>sys.getrecursionlimit()</code>, 보통 1000)가 있어서 깊은 재귀는 명시적 스택으로 바꾸는 편이 안전하다.</p>
<p>그 밖에 DFS, 실행 취소(Undo), 수식 계산(후위 표기) 등이 스택의 응용이다.</p>
<h3>큐 = 먼저 온 것부터 처리</h3>
<p>큐는 <strong>공정성과 순서</strong>가 필요한 곳에 쓰인다. 프린터 작업 대기열, OS의 준비(ready) 큐, 네트워크 패킷 버퍼, 그리고 BFS. BFS가 큐를 쓰는 이유는 "가까운 것부터" 처리해야 하기 때문이다 — 먼저 발견된 노드가 먼저 확장된다.</p>
<h3>구현할 때의 함정</h3>
<p>Python list로 큐를 만들면 <code>pop(0)</code>이 뒤 원소를 모두 당기므로 $O(n)$이다. <code>collections.deque</code>를 써야 한다. 배열로 큐를 직접 구현할 때는 <strong>원형 큐</strong>를 쓴다: head와 tail 인덱스를 모듈러로 돌려 앞쪽 빈 칸을 재사용한다. 이때 head == tail이 "비었다"와 "가득 찼다"를 구별하지 못하는 문제가 있어서, 한 칸을 비워 두거나 원소 개수를 따로 센다.</p>`,

from collections import deque

def is_balanced(s):
    pairs = {')': '(', ']': '[', '}': '{'}
    stack = []
    for ch in s:
        if ch in '([{':
            stack.append(ch)               # 여는 괄호는 짝이 올 때까지 보관
        elif ch in pairs:
            if not stack or stack.pop() != pairs[ch]:
                return False               # 가장 최근에 연 괄호와 짝이 맞아야 함
    return not stack

print(is_balanced("f(a[i], {k: v})"))    # True
print(is_balanced("(]"))                  # False

class CircularQueue:
    def __init__(self, capacity):
        self.buf = [None] * capacity
        self.head = self.size = 0          # size를 따로 세서 빈/가득 참을 구별
    def enqueue(self, x):
        if self.size == len(self.buf):
            raise OverflowError("가득 참")
        self.buf[(self.head + self.size) % len(self.buf)] = x
        self.size += 1
    def dequeue(self):
        if self.size == 0:
            raise IndexError("비어 있음")
        x = self.buf[self.head]
        self.head = (self.head + 1) % len(self.buf)
        self.size -= 1
        return x

q = CircularQueue(3)
for x in (1, 2, 3):
    q.enqueue(x)
print(q.dequeue(), q.dequeue())            # 1 2
q.enqueue(4); q.enqueue(5)                 # 배열 끝을 넘어 앞칸을 재사용
print([q.dequeue() for _ in range(3)])     # [3, 4, 5]

dq = deque([1, 2, 3])                      # 실전에서는 deque
dq.appendleft(0); dq.pop()
print(dq)                                  # deque([0, 1, 2])

      body: R`
<p>배열은 인덱스를 알면 $O(1)$이다. 해시 테이블은 이 성질을 임의의 키로 확장한다: <strong>키 → 정수(해시) → 배열 인덱스</strong>. 보통 <code>index = hash(key) mod m</code> ($m$: 버킷 수)이다.</p>
<h3>충돌은 피할 수 없다</h3>
<p>가능한 키는 무한하고 버킷은 유한하므로(비둘기집 원리) 서로 다른 키가 같은 버킷에 오는 <strong>충돌</strong>이 반드시 생긴다. 해결 방식은 두 가지다.</p>
<ul>
<li><strong>체이닝</strong>: 버킷마다 리스트를 두고 충돌한 항목을 이어 붙인다.</li>
<li><strong>개방 주소법</strong>: 버킷이 차 있으면 정해진 규칙(선형·이차 탐사, 이중 해싱 등)으로 다른 빈 칸을 찾는다. 모든 항목이 하나의 배열 안에 있어 캐시 효율이 좋다. CPython의 dict가 이 방식이다.</li>
</ul>
<p>어느 방식이든 같은 버킷 안에서는 <strong><code>==</code>로 실제 키를 비교</strong>해 구분한다. 해시는 후보를 좁히는 용도이고, 최종 판단은 동등성 비교다.</p>
<h3>적재율과 리사이즈</h3>
<p>적재율 $\alpha = n/m$이 커질수록 충돌이 늘어 탐색 비용이 커진다. 그래서 일정 적재율을 넘으면 버킷 배열을 키우고 모든 항목을 다시 배치(재해싱)한다. 동적 배열처럼 비율로 키우면 재해싱 비용이 상각되어 삽입이 평균 $O(1)$로 유지된다. CPython dict는 테이블의 약 2/3가 차면 확장한다.</p>
<h3>왜 dict 키는 해시 가능(불변)해야 하는가</h3>
<p>키를 넣을 때 계산한 해시로 버킷이 정해진다. 만약 키 객체의 내용이 바뀌어 해시가 달라지면, 나중에 찾을 때 <strong>다른 버킷을 보게 되어</strong> 분명히 넣은 키를 찾지 못한다. 그래서 list처럼 가변 객체는 <code>__hash__</code>를 제공하지 않는다. 같은 이유로 직접 만든 클래스에서는 <code>a == b</code>이면 반드시 <code>hash(a) == hash(b)</code>이어야 한다. <code>1 == 1.0 == True</code>이므로 이 셋의 해시도 같다.</p>
<h3>평균 O(1), 최악 O(n)</h3>
<p>모든 키가 한 버킷에 몰리면 탐색은 $O(n)$이 된다. 공격자가 의도적으로 충돌 키를 대량 전송하는 <strong>해시 충돌 DoS</strong>를 막기 위해 Python은 문자열·바이트의 해시에 프로세스마다 다른 무작위 시드를 쓴다(<code>PYTHONHASHSEED</code>). 그래서 실행할 때마다 <code>hash("abc")</code> 값이 다르다.</p>
<h3>해시 테이블이 못 하는 일</h3>
<p>해시는 키의 순서를 의도적으로 흩어 놓는다. 따라서 "80 이상 90 이하인 키"나 "가장 작은 키" 같은 <strong>범위·순서 질의</strong>는 전체를 훑어야 한다. 이런 질의가 필요하면 정렬을 유지하는 트리(DB의 B-Tree 인덱스)를 쓴다. 또 해시는 "정확히 같은 키"만 찾는다. "비슷한 벡터"를 찾는 벡터 검색에는 오히려 비슷한 입력이 같은 버킷에 오도록 설계한 <strong>LSH(Locality-Sensitive Hashing)</strong> 같은 다른 아이디어가 필요하다.</p>`,

class HashMap:
    """체이닝 방식 해시 테이블 (학습용)"""
    def __init__(self, m=8):
        self.buckets = [[] for _ in range(m)]
        self.n = 0

    def _bucket(self, key):
        return self.buckets[hash(key) % len(self.buckets)]

    def put(self, key, value):
        b = self._bucket(key)
        for i, (k, _) in enumerate(b):
            if k == key:                       # 버킷 안에서는 == 로 실제 키 비교
                b[i] = (key, value)
                return
        b.append((key, value))
        self.n += 1
        if self.n / len(self.buckets) > 0.75:  # 적재율 초과 → 2배로 재해싱
            self._resize(2 * len(self.buckets))

    def get(self, key):
        for k, v in self._bucket(key):
            if k == key:
                return v
        raise KeyError(key)

    def _resize(self, m):
        items = [kv for b in self.buckets for kv in b]
        self.buckets = [[] for _ in range(m)]
        for k, v in items:
            self._bucket(k).append((k, v))

h = HashMap()
for i in range(20):
    h.put(f"key{i}", i)
print(h.get("key13"), "버킷 수:", len(h.buckets), "최장 체인:", max(map(len, h.buckets)))

<p>트리는 사이클이 없는 연결 그래프이고, 루트에서 각 노드로 가는 경로가 유일하다. 계층(파일 시스템, HTML DOM, 조직도)을 표현하는 자연스러운 구조다. 여기서는 탐색에 쓰이는 <strong>이진 탐색 트리(BST)</strong>의 원리에 집중한다.</p>
<h3>불변식 하나가 모든 것을 결정한다</h3>
<p>BST의 규칙: 모든 노드에 대해 <strong>왼쪽 서브트리의 키 &lt; 노드의 키 &lt; 오른쪽 서브트리의 키</strong>. 이 규칙 덕분에 찾는 값과 현재 노드를 한 번 비교하면 반대쪽 서브트리 전체를 볼 필요가 없어진다. 정렬된 배열의 이진 탐색을 "포인터 구조"로 옮긴 것이다. 같은 이유로 <strong>중위 순회</strong>(왼쪽 → 자기 → 오른쪽)를 하면 키가 정렬된 순서로 나온다.</p>
<h3>높이가 성능이다</h3>
<p>탐색·삽입·삭제 모두 루트에서 한 경로를 따라 내려가므로 $O(h)$이다($h$: 높이).</p>
<ul>
<li>균형이 잘 잡히면 $h \approx \log_2 n$ → $O(\log n)$.</li>
<li><strong>정렬된 순서로 삽입</strong>하면 매번 오른쪽에만 붙어 사실상 연결 리스트가 되고 $h = n-1$ → $O(n)$.</li>
</ul>
<p>그래서 실무용 트리는 삽입·삭제 때마다 <strong>회전(rotation)</strong>으로 높이를 $O(\log n)$으로 유지한다. AVL 트리(좌우 높이 차 ≤ 1)와 레드-블랙 트리(색 규칙으로 가장 긴 경로가 가장 짧은 경로의 2배 이하)가 대표적이다. 회전은 중위 순서를 보존하면서 부모-자식 관계만 바꾸는 연산이다.</p>
<h3>디스크에서는 B-Tree</h3>
<p>메모리에서는 비교 횟수가 비용이지만, 디스크(또는 SSD) 기반 DB에서는 <strong>블록을 읽는 횟수</strong>가 비용이다. 이진 트리는 노드 하나에 키 하나라 높이가 $\log_2 n$이다. B-Tree는 노드 하나(한 블록)에 키를 수백 개 넣어 분기 수를 키우고, 높이를 $\log_{\text{수백}} n$으로 낮춘다. 수억 건이어도 몇 번의 블록 읽기로 찾을 수 있는 이유다.</p>
<h3>해시 테이블과 비교</h3>
<p>평균 조회는 해시가 $O(1)$로 더 빠르지만, BST는 <strong>정렬 순서</strong>를 유지하므로 최솟값·최댓값, 범위 질의, "x보다 큰 가장 작은 키" 같은 질의를 $O(\log n)$(+ 결과 크기)에 처리할 수 있다.</p>`,

      code: R`
import random

class Node:
    __slots__ = ("key", "left", "right")
    def __init__(self, key):
        self.key, self.left, self.right = key, None, None

def insert(root, key):                    # 반복문으로 구현 (깊은 트리에서도 재귀 한도 문제 없음)
    if root is None:
        return Node(key)
    node = root
    while True:
        if key < node.key:
            if node.left is None:
                node.left = Node(key); break
            node = node.left
        else:
            if node.right is None:
                node.right = Node(key); break
            node = node.right
    return root

def search_steps(root, key):
    steps = 0
    while root:
        steps += 1
        if key == root.key:
            return steps
        root = root.left if key < root.key else root.right
    return steps

def height(root):                         # 레벨 단위로 내려가며 높이 계산
    h, level = -1, [root] if root else []
    while level:
        h += 1
        level = [c for n in level for c in (n.left, n.right) if c]
    return h

def inorder(root):                        # 왼쪽 → 자기 → 오른쪽 = 정렬 순서
    out, stack = [], []
    while stack or root:
        while root:
            stack.append(root); root = root.left
        root = stack.pop(); out.append(root.key); root = root.right
    return out

n = 2000
keys = list(range(n))
for name, order in [("무작위 순서 삽입", random.sample(keys, n)), ("정렬된 순서 삽입", keys)]:
    root = None
    for k in order:
        root = insert(root, k)
    print(f"{name}: 높이={height(root)}, 최댓값 탐색 비교 횟수={search_steps(root, n - 1)}")
print(inorder(root)[:10])

      body: R`
<p>우선순위 큐는 "넣기"와 "가장 우선순위가 높은 것 꺼내기"를 지원하는 ADT다. 정렬된 배열로 만들면 꺼내기는 $O(1)$이지만 넣기가 $O(n)$, 정렬 안 된 배열이면 그 반대다. <strong>힙</strong>은 두 연산 모두 $O(\log n)$으로 만드는 절충안이다.</p>
<h3>두 가지 규칙</h3>
<ol>
<li><strong>모양 규칙</strong>: 완전 이진 트리 — 마지막 레벨을 제외하고 꽉 차 있고, 마지막 레벨은 왼쪽부터 채운다.</li>
<li><strong>힙 규칙</strong>(최소 힙): 모든 부모 ≤ 자식. 따라서 루트가 최솟값이다.</li>
</ol>
<p>힙 규칙은 BST보다 훨씬 <strong>약하다</strong>. 부모-자식 관계만 정하고 형제나 사촌 사이의 순서는 정하지 않는다. 그래서 힙 배열을 그대로 출력하면 정렬되어 있지 않다. 이 약한 규칙 덕분에 유지 비용이 싸다.</p>
<h3>배열로 저장되는 이유</h3>
<p>완전 이진 트리는 빈칸이 없으므로 레벨 순서대로 배열에 넣으면 인덱스 계산만으로 부모·자식을 찾을 수 있다: $i$의 자식은 $2i+1, 2i+2$, 부모는 $\lfloor (i-1)/2 \rfloor$. 포인터가 없어 메모리 효율과 캐시 효율이 좋다.</p>
<h3>연산</h3>
<ul>
<li><strong>push</strong>: 배열 끝(모양 규칙 유지)에 넣고, 부모보다 작으면 교환하며 위로 올린다(sift-up). 최대 높이만큼 → $O(\log n)$.</li>
<li><strong>pop</strong>: 루트를 꺼내고, 마지막 원소를 루트로 옮긴 뒤 더 작은 자식과 교환하며 내린다(sift-down). $O(\log n)$.</li>
<li><strong>heapify</strong>: 배열 전체를 힙으로 만들기. 아래쪽 노드부터 sift-down하면 $O(n)$이다. 노드의 절반은 잎이라 내려갈 거리가 0이고, 높이가 높은 노드일수록 개수가 적기 때문이다.</li>
</ul>
<h3>응용</h3>
<p>다익스트라 최단 경로(가장 가까운 미확정 노드), OS·이벤트 스케줄링(가장 이른 시각의 작업), 힙 정렬, 그리고 <strong>Top-k</strong>: $n$개 중 상위 $k$개는 크기 $k$인 최소 힙을 유지하며 훑으면 $O(n\log k)$로, 전체 정렬 $O(n \log n)$보다 싸다. Python <code>heapq</code>는 최소 힙이며, 최대 힙이 필요하면 값의 부호를 뒤집어 넣는다.</p>`,
      analogy: R`<p>응급실 분류(트리아지). 대기 환자 전체를 위급한 순서로 완벽히 줄 세울 필요는 없다. "지금 가장 위급한 한 명"만 항상 알 수 있으면 된다. 새 환자가 오면 그 환자의 위급도에 맞는 높이까지만 올라가고, 맨 앞 환자가 진료실에 들어가면 남은 사람 중 가장 위급한 사람이 앞으로 온다.</p>`,

import heapq, random

def push(h, x):
    h.append(x)
    i = len(h) - 1
    while i > 0 and h[(i - 1) // 2] > h[i]:    # 부모보다 작으면 위로 (sift-up)
        p = (i - 1) // 2
        h[i], h[p] = h[p], h[i]
        i = p

def pop(h):
    top, last = h[0], h.pop()
    if h:
        h[0] = last
        i = 0
        while True:                             # 더 작은 자식과 교환하며 아래로 (sift-down)
            l, r, m = 2 * i + 1, 2 * i + 2, i
            if l < len(h) and h[l] < h[m]: m = l
            if r < len(h) and h[r] < h[m]: m = r
            if m == i: break
            h[i], h[m] = h[m], h[i]
            i = m
    return top

data = random.sample(range(100), 10)
h = []
for x in data:
    push(h, x)

print(heapq.nlargest(3, nums) == sorted(nums, reverse=True)[:3])   # True

    heapq.heappush(mx, -x)
print(-heapq.heappop(mx))   # 9

<h3>표현 방법</h3>

<h3>BFS가 최단 경로를 보장하는 이유</h3>
<p>큐는 먼저 넣은 것을 먼저 꺼내므로, 시작점에서 거리 $d$인 정점이 <strong>모두</strong> 처리된 다음에야 거리 $d+1$인 정점이 처리된다. 그래서 어떤 정점을 처음 발견한 순간의 거리가 곧 최단 거리다. 단, 모든 간선의 비용이 같을 때만 성립한다. 가중치가 다르면 다익스트라가 필요하다.</p>

from collections import deque

graph = {                                 # 인접 리스트 (무방향)
    'A': ['B', 'C'], 'B': ['A', 'D', 'E'], 'C': ['A', 'F'],
    'D': ['B'], 'E': ['B', 'F'], 'F': ['C', 'E', 'G'], 'G': ['F'],
}

def bfs(start):
    dist = {start: 0}                     # 방문 표시 겸 거리
    q = deque([start])
    while q:
        u = q.popleft()
        for v in graph[u]:
            if v not in dist:             # 큐에 '넣을 때' 표시해야 중복 삽입이 없다
                dist[v] = dist[u] + 1
                q.append(v)
    return dist

def dfs(start):
    seen, order, stack = set(), [], [start]
    while stack:
        u = stack.pop()
        if u in seen:
            continue
        seen.add(u)
        order.append(u)
        stack.extend(reversed(graph[u]))  # 인접 순서대로 방문하려고 뒤집어 넣음
    return order

print("BFS 거리:", bfs('A'))
print("DFS 순서:", dfs('A'))

q = deque(u for u in dag if indeg[u] == 0)
topo = []

        if indeg[v] == 0:

      body: R`
<h3>왜 n log n이 한계인가</h3>
<p>원소끼리 "비교"만으로 순서를 알아내는 정렬은 비교 결과(예/아니오)에 따라 갈라지는 <strong>결정 트리</strong>로 볼 수 있다. 서로 다른 입력 순열 $n!$개를 모두 구별하려면 잎이 $n!$개 이상이어야 하고, 이진 트리의 높이(=최악의 비교 횟수)는 $\log_2 n! = \Theta(n\log n)$ 이상이다. 그래서 어떤 비교 정렬도 최악의 경우 이보다 빠를 수 없다.</p>
<h3>병합 정렬 — 분할 정복의 교과서</h3>
<p>반으로 나눠 각각 정렬한 뒤 <strong>병합</strong>한다. 정렬된 두 리스트의 병합은 앞에서부터 작은 것을 고르면 되므로 $O(n)$이다. 분할 깊이 $\log n$ × 단계당 $n$ = 항상 $O(n\log n)$. 같은 값이면 왼쪽 것을 먼저 고르면 <strong>안정(stable)</strong>하다. 단점은 $O(n)$ 추가 메모리.</p>
<h3>퀵 정렬 — 평균이 가장 빠른 경우가 많은 정렬</h3>
<p>피벗을 골라 작은 것/큰 것으로 나눈 뒤 재귀한다. 나누는 작업을 배열 안에서(제자리) 할 수 있고 연속 메모리를 순차적으로 훑어 캐시 친화적이다. 그러나 피벗이 매번 최솟값/최댓값이면 한쪽이 비어 $O(n^2)$ — 예: 이미 정렬된 배열에서 첫 원소를 피벗으로 쓰는 경우. 무작위 피벗을 쓰면 어떤 입력이든 <strong>기대</strong> $O(n\log n)$이 된다. 일반적으로 안정 정렬이 아니다.</p>
<h3>힙 정렬, 삽입 정렬</h3>
<p>힙 정렬은 최악 $O(n\log n)$에 제자리 정렬이지만 불안정하고 메모리 접근이 흩어져 실제로는 퀵 정렬보다 느린 경우가 많다. 삽입 정렬은 $O(n^2)$이지만 실제 비용이 "뒤바뀐 쌍(inversion)의 수"에 비례하므로 <strong>거의 정렬된 데이터</strong>에서는 $O(n)$에 가깝고, 작은 배열에서 상수가 작다.</p>
<h3>안정성은 언제 중요한가</h3>
<p>안정 정렬은 키가 같은 원소들의 <strong>기존 순서를 유지</strong>한다. 그래서 "이름순으로 정렬한 뒤 점수순으로 다시 정렬"하면 같은 점수 안에서는 이름순이 유지된다. 여러 키로 단계적으로 정렬할 때 필수다.</p>
<h3>Python의 sorted: Timsort</h3>
<p>현실 데이터에는 이미 정렬된 구간(run)이 많다는 관찰에서 출발한 하이브리드 정렬이다. run을 찾고, 짧은 run은 삽입 정렬로 늘린 뒤, 병합 정렬 방식으로 합친다. 안정적이고 최악 $O(n\log n)$, 이미 정렬된 입력에서는 $O(n)$이다.</p>
<h3>비교하지 않으면 더 빠를 수 있다</h3>

import random

def merge_sort(a):
    if len(a) <= 1:
        return a
    mid = len(a) // 2
    L, R = merge_sort(a[:mid]), merge_sort(a[mid:])
    out, i, j = [], 0, 0
    while i < len(L) and j < len(R):
        if L[i] <= R[j]:               # '<=': 같은 값은 왼쪽 것이 먼저 → 안정 정렬
            out.append(L[i]); i += 1
        else:
            out.append(R[j]); j += 1
    return out + L[i:] + R[j:]

def quick_sort(a):                     # 이해용 버전 (제자리 분할 아님)
    if len(a) <= 1:
        return a
    pivot = random.choice(a)           # 무작위 피벗: 어떤 입력이든 기대 O(n log n)
    return (quick_sort([x for x in a if x < pivot])
            + [x for x in a if x == pivot]
            + quick_sort([x for x in a if x > pivot]))

data = [random.randint(0, 99) for _ in range(20)]
assert merge_sort(data) == quick_sort(data) == sorted(data)
print(merge_sort(data))

<p>이진 탐색이 가능한 이유는 정렬 그 자체가 아니라, 가운데 원소 하나만 보고 <strong>"답은 이쪽 절반에 없다"고 확신할 수 있는 성질</strong>이다. 정렬된 배열에서 <code>a[mid] &lt; x</code>이면 <code>a[0..mid]</code>는 모두 x보다 작으니 버릴 수 있다. 이 보장이 깨지면(정렬 안 된 배열) 버린 절반에 답이 있을 수 있어 실패한다.</p>
<h3>불변식으로 생각하면 off-by-one이 사라진다</h3>
<p>이진 탐색 버그는 대부분 경계(<code>&lt;</code> vs <code>&lt;=</code>, <code>mid</code> vs <code>mid±1</code>)에서 나온다. 해결책은 구간의 의미를 먼저 정하는 것이다. 반열린 구간 <code>[lo, hi)</code>를 쓰고 다음 불변식을 유지한다:</p>
<ul><li><code>a[:lo]</code>의 원소는 모두 <code>x</code>보다 작다.</li><li><code>a[hi:]</code>의 원소는 모두 <code>x</code> 이상이다.</li></ul>
<p>그러면 <code>a[mid] &lt; x</code>일 때 mid까지 "작은 쪽"이 확정되므로 <code>lo = mid + 1</code>, 아니면 mid는 "이상인 쪽"이므로 <code>hi = mid</code>. 루프가 끝나 <code>lo == hi</code>가 되면 그 위치가 "x 이상인 첫 위치(lower bound)"다. Python <code>bisect_left</code>가 정확히 이것이다. 매 반복마다 구간이 반드시 줄어드므로 종료도 보장된다.</p>

import bisect

def lower_bound(a, x):
    """x 이상인 첫 위치. 불변식: a[:lo] < x  그리고  a[hi:] >= x"""
    lo, hi = 0, len(a)                 # 반열린 구간 [lo, hi)
    while lo < hi:
        mid = (lo + hi) // 2
        if a[mid] < x:
            lo = mid + 1               # mid까지는 x보다 작다 → 버림
        else:
            hi = mid                   # mid는 답 후보 → 남김
    return lo

a = [1, 3, 3, 3, 7, 9]
for x in [0, 3, 4, 10]:
    assert lower_bound(a, x) == bisect.bisect_left(a, x)
print(lower_bound(a, 3), bisect.bisect_right(a, 3))   # 1 4 → 3의 개수 = 4 - 1 = 3

# 답에 대한 이진 탐색: f(k) = (k*k > n) 은 F...F T...T 꼴(단조)
def isqrt(n):
    lo, hi = 0, n + 1
    while lo < hi:                     # k*k > n 을 만족하는 최소 k 찾기
        mid = (lo + hi) // 2
        if mid * mid > n:
            hi = mid
        else:
            lo = mid + 1
    return lo - 1

print(isqrt(10**12 + 5), isqrt(15))    # 1000000 3

from functools import lru_cache

calls = 0
def fib_naive(n):
    global calls
    calls += 1
    return n if n < 2 else fib_naive(n - 1) + fib_naive(n - 2)

fib_naive(25)
print("단순 재귀 호출 수:", calls)                       # 242785

@lru_cache(maxsize=None)                                  # 메모이제이션
def fib_memo(n):
    return n if n < 2 else fib_memo(n - 1) + fib_memo(n - 2)

print(fib_memo(25), "/ 실제 계산 횟수:", fib_memo.cache_info().misses)   # 75025 / 26

def knapsack(items, W):
    """items: (무게, 가치) 목록. dp[w] = 용량 w로 얻을 수 있는 최대 가치"""
    dp = [0] * (W + 1)
    for wt, val in items:
        for w in range(W, wt - 1, -1):   # 큰 용량부터: dp[w-wt]가 아직 '이번 물건 전' 값이어야 함
            dp[w] = max(dp[w], dp[w - wt] + val)
    return dp[W]

print(knapsack([(1, 1), (3, 4), (4, 5), (5, 7)], 7))   # 9 (무게 3+4)

def select_activities(acts):
    """끝나는 시간이 빠른 순으로 고르면 최대 개수 (교환 논증으로 증명 가능)"""
    chosen, end = [], float("-inf")
    for s, e in sorted(acts, key=lambda a: a[1]):
        if s >= end:
            chosen.append((s, e))
            end = e
    return chosen

        while amount >= c:
            amount -= c
            used.append(c)
    return used

def coins_dp(amount, coins):       # 최소 동전 개수 (정답)
    INF = float("inf")
    dp = [0] + [INF] * amount
    for a in range(1, amount + 1):
        dp[a] = min((dp[a - c] + 1 for c in coins if c <= a), default=INF)
    return dp[amount]

<h3>공통 연산: 완화</h3>
<p>현재 알고 있는 거리 <code>d[v]</code>보다 "u를 거쳐 가는 길" <code>d[u] + w(u,v)</code>가 짧으면 갱신한다. 처음에는 시작점만 0, 나머지는 ∞. 모든 최단 경로 알고리즘은 완화를 반복하며, 언제 멈춰도 되는지를 보장하는 방식이 다르다.</p>
<h3>다익스트라: 가까운 것부터 확정 (그리디)</h3>
<p>아직 확정되지 않은 정점 중 <code>d</code>가 가장 작은 정점을 꺼내 <strong>확정</strong>하고, 그 이웃을 완화한다. 왜 확정해도 되는가? 다른 경로로 이 정점에 오려면 이미 이 정점보다 먼(또는 같은) 정점을 거쳐야 하고, 간선이 <strong>음수가 아니라면</strong> 거리는 더 늘어나기만 하기 때문이다. 이 논리는 음수 간선이 있으면 깨진다 — 멀리 돌아가다 음수 간선으로 크게 줄어드는 경로가 있을 수 있다.</p>
<p>최솟값 꺼내기를 힙으로 하면 $O((V+E)\log V)$. Python <code>heapq</code>는 우선순위 갱신(decrease-key)이 없으므로, 갱신할 때 새 항목을 그냥 넣고 꺼낼 때 낡은 항목(이미 더 짧은 거리로 처리된 정점)을 건너뛰는 방식을 쓴다.</p>
<h3>벨만-포드: 모든 간선을 V−1번 (DP)</h3>
<p>단순 경로(사이클 없는 경로)는 간선이 최대 $V-1$개다. 모든 간선을 한 번씩 완화하는 것을 $k$번 반복하면 "간선 $k$개 이하로 가는 최단 거리"가 확정된다. 그래서 $V-1$번이면 충분하고, 음수 간선도 처리할 수 있다. $V$번째 반복에서도 거리가 줄어든다면 무한히 줄일 수 있는 <strong>음수 사이클</strong>이 있다는 뜻이다. $O(VE)$.</p>
<h3>플로이드-워셜: 모든 쌍 (DP)</h3>
<p>"정점 $1..k$만 경유할 수 있을 때 i→j 최단 거리"를 $k$를 늘려 가며 계산한다. 3중 루프 $O(V^3)$으로 모든 쌍의 최단 거리를 한 번에 구한다. 정점 수가 수백 개 이하일 때 적합하다.</p>
<table><tr><th>알고리즘</th><th>대상</th><th>음수 간선</th><th>복잡도</th></tr>
<tr><td>BFS</td><td>단일 출발, 가중치 동일</td><td>-</td><td>$O(V+E)$</td></tr>
<tr><td>다익스트라</td><td>단일 출발</td><td>불가</td><td>$O((V+E)\log V)$</td></tr>

<h3>네트워크 라우팅과의 연결</h3>
<p>인터넷 라우팅 프로토콜 중 OSPF(링크 상태 방식)는 각 라우터가 전체 지도를 알고 다익스트라로 경로를 계산하고, RIP(거리 벡터 방식)는 이웃끼리 거리 정보를 교환하며 벨만-포드 방식으로 갱신한다.</p>`,

import heapq

def dijkstra(graph, src):
    dist = {u: float("inf") for u in graph}
    dist[src] = 0
    pq, done = [(0, src)], set()
    while pq:
        d, u = heapq.heappop(pq)
        if u in done:              # 이미 확정된 정점의 낡은 항목 → 건너뜀
            continue
        done.add(u)                # 꺼낸 순간 거리 확정 (음수 간선이 없다는 가정)
        for v, w in graph[u]:
            if v not in done and d + w < dist[v]:   # 완화
                dist[v] = d + w
                heapq.heappush(pq, (dist[v], v))
    return dist

def bellman_ford(graph, src):
    dist = {u: float("inf") for u in graph}
    dist[src] = 0
    edges = [(u, v, w) for u in graph for v, w in graph[u]]
    for _ in range(len(graph) - 1):          # 최단 경로의 간선 수 ≤ V-1
        for u, v, w in edges:
            if dist[u] + w < dist[v]:
                dist[v] = dist[u] + w
    for u, v, w in edges:                    # 그래도 줄어들면 음수 사이클
        if dist[u] + w < dist[v]:
            raise ValueError("음수 사이클 존재")
    return dist

g = {'S': [('A', 4), ('B', 1)], 'A': [('C', 1)], 'B': [('A', 2), ('C', 5)], 'C': []}
print(dijkstra(g, 'S'))                      # {'S': 0, 'A': 3, 'B': 1, 'C': 4}

neg = {'S': [('A', 1), ('B', 5)], 'A': [], 'B': [('A', -10)]}   # 음수 간선
print("다익스트라:", dijkstra(neg, 'S'))     # A=1 (틀림: A를 너무 일찍 확정)
print("벨만-포드:", bellman_ford(neg, 'S'))  # A=-5 (정답)

<h3>프로그램과 프로세스</h3>
<p>프로그램은 디스크에 있는 실행 파일(명령어와 초기 데이터)일 뿐이다. 이것을 실행하면 OS가 메모리 공간을 할당하고, 실행 상태(어디까지 실행했는지, 레지스터 값, 열린 파일 등)를 붙여 <strong>프로세스</strong>를 만든다. 같은 프로그램을 두 번 실행하면 서로 독립된 프로세스 두 개가 생긴다.</p>
<h3>주소 공간의 구조</h3>
<ul>
<li><strong>코드(텍스트)</strong>: 실행할 기계어. 보통 읽기 전용이라 같은 프로그램의 여러 프로세스가 물리 메모리를 공유할 수 있다.</li>
<li><strong>데이터</strong>: 전역·정적 변수.</li>
<li><strong>힙</strong>: 실행 중 동적으로 할당하는 영역. Python의 모든 객체가 여기에 있다.</li>
<li><strong>스택</strong>: 함수 호출마다 지역 변수와 돌아갈 주소를 쌓는 영역(콜 스택). 재귀가 너무 깊으면 이 영역이 넘친다.</li>
</ul>
<p>각 프로세스는 자신만의 <strong>가상 주소 공간</strong>을 가진다. 두 프로세스가 같은 주소값을 써도 실제로는 다른 물리 메모리를 가리키므로, 한 프로세스가 다른 프로세스의 메모리를 읽거나 망가뜨릴 수 없다. 이것이 격리의 핵심이다.</p>
<h3>PCB: 멈췄다가 이어 가기 위한 기록</h3>
<p>CPU 코어 하나는 한 순간에 하나의 흐름만 실행한다. 여러 프로세스가 동시에 도는 것처럼 보이는 것은 OS가 아주 짧은 간격으로 실행할 프로세스를 바꾸기 때문이다. 바꾸려면 지금 프로세스의 상태를 어딘가에 저장해야 하는데, 그곳이 <strong>PCB(Process Control Block)</strong>다. PID, 상태, 프로그램 카운터(다음 실행할 명령 주소), 레지스터 값, 메모리 관리 정보(페이지 테이블 위치), 열린 파일 목록, 스케줄링 정보(우선순위 등)가 들어 있다.</p>
<h3>상태 전이: 왜 '대기' 상태가 있는가</h3>
<p>프로세스는 <strong>준비</strong>(CPU만 받으면 실행 가능) → <strong>실행</strong> → 다시 준비(시간 할당이 끝나 선점됨) 또는 <strong>대기</strong>(디스크·네트워크 응답 같은 이벤트를 기다림)를 오간다. I/O는 CPU에 비해 수천~수백만 배 느리므로, I/O를 기다리는 프로세스가 CPU를 붙잡고 있으면 낭비다. 대기 상태로 빼 두고 그동안 다른 준비 프로세스를 실행하는 것이 <strong>다중 프로그래밍</strong>의 핵심 아이디어다.</p>
<h3>프로세스 생성: fork와 exec</h3>
<p>Unix 계열에서는 <code>fork()</code>가 현재 프로세스를 복제해 자식을 만들고, 자식이 <code>exec()</code>로 다른 프로그램을 덮어써 실행한다. 주소 공간 전체를 실제로 복사하면 느리므로, 일단 같은 물리 페이지를 읽기 전용으로 공유하다가 <strong>쓰기가 일어나는 페이지만 그때 복사(Copy-on-Write)</strong>한다. 부모는 <code>wait()</code>로 자식의 종료 상태를 회수한다. 종료했지만 회수되지 않은 자식을 좀비, 부모가 먼저 끝나 버린 자식을 고아 프로세스라 한다.</p>
<h3>격리의 대가: IPC</h3>
<p>메모리가 분리되어 있으므로 프로세스끼리 데이터를 주고받으려면 파이프, 소켓, 공유 메모리 같은 <strong>프로세스 간 통신(IPC)</strong>을 거쳐야 한다. Python <code>multiprocessing</code>은 별도 프로세스를 띄워 GIL의 제약을 피하지만, 인자와 결과를 직렬화(pickle)해 주고받는 비용이 있다. 그래서 큰 데이터를 자주 넘기는 작업에서는 병렬화 이득이 줄어든다.</p>`,
      analogy: R`<p>프로그램은 <strong>요리 레시피</strong>, 프로세스는 그 레시피로 <strong>지금 요리 중인 상황</strong>이다. 같은 레시피로 두 사람이 요리하면 각자의 조리대(주소 공간)를 쓴다. 요리사가 한 명뿐인 주방에서 여러 요리를 번갈아 할 때는, 손을 뗄 때마다 "몇 번째 단계까지 했고, 불은 몇 단이었는지"를 메모지(PCB)에 적어 둬야 다시 이어서 할 수 있다. 오븐이 예열되는 동안(I/O 대기) 가만히 서 있지 않고 다른 요리를 하는 것이 다중 프로그래밍이다.</p>`,

import os
from multiprocessing import Process, Queue

counter = 0

def child(q):
    global counter
    counter += 100                    # 자식 주소 공간의 '사본'만 바뀐다
    q.put((os.getpid(), os.getppid(), counter))

if __name__ == "__main__":            # multiprocessing은 이 가드가 필요하다
    q = Queue()
    p = Process(target=child, args=(q,))
    p.start()
    pid, ppid, c = q.get()            # 값은 IPC(큐 = 파이프 + 직렬화)로만 받을 수 있다
    p.join()                          # 자식 종료를 기다리고 상태를 회수 (좀비 방지)
    print(f"부모 PID {os.getpid()} / 자식 PID {pid} (자식이 본 부모 PID {ppid})")
    print(f"자식 안의 counter = {c}, 부모의 counter = {counter}")   # 100 vs 0
    print("자식 종료 코드:", p.exitcode)

<h3>무엇을 공유하고 무엇을 따로 갖는가</h3>
<table><tr><th>스레드끼리 공유</th><th>스레드마다 따로</th></tr>
<tr><td>코드, 전역 데이터, 힙(모든 객체), 열린 파일, 주소 공간 전체</td><td>스택(지역 변수, 호출 기록), 레지스터, 프로그램 카운터, 스레드 지역 저장소</td></tr></table>
<p>스택과 레지스터가 따로인 이유는 각 스레드가 <strong>코드의 서로 다른 지점</strong>을 실행하며 서로 다른 함수 호출 경로에 있을 수 있어야 하기 때문이다. 반면 힙은 공유되므로, 한 스레드가 만든 리스트를 다른 스레드가 그대로 읽고 쓸 수 있다.</p>
<h3>왜 스레드를 쓰는가</h3>
<ul>
<li><strong>가볍다</strong>: 새 주소 공간을 만들 필요가 없어 생성이 빠르고, 같은 프로세스 내 스레드 전환은 주소 공간(페이지 테이블)을 바꿀 필요가 없어 프로세스 전환보다 싸다.</li>
<li><strong>공유가 쉽다</strong>: IPC 없이 같은 메모리를 직접 쓴다.</li>
<li><strong>응답성</strong>: 무거운 작업은 다른 스레드에 맡기고 UI·네트워크 응답은 계속 처리한다.</li>
<li><strong>병렬성</strong>: 멀티코어에서 여러 스레드가 실제로 동시에 실행된다.</li>
</ul>
<h3>대가</h3>
<p>공유 메모리에 여러 스레드가 동시에 쓰면 실행 순서에 따라 결과가 달라지는 경쟁 상태가 생긴다(→ 동기화). 또 격리가 없으므로 한 스레드가 메모리를 망가뜨리거나 치명적 오류로 죽으면 프로세스 전체가 영향을 받는다. 웹 브라우저가 탭마다 별도 프로세스를 쓰는 이유 중 하나다.</p>
<h3>동시성과 병렬성</h3>
<p><strong>동시성</strong>은 여러 작업이 진행 중인 상태를 다루는 구조(코어 하나에서 번갈아 실행해도 성립), <strong>병렬성</strong>은 실제로 같은 순간에 여러 작업이 실행되는 것(여러 코어 필요)이다. 스레드는 둘 다를 위한 도구지만, 병렬성은 하드웨어와 런타임이 허락해야 얻는다.</p>
<h3>커널 스레드와 사용자 수준 스레드</h3>
<p>Linux·Windows의 일반 스레드는 사용자 스레드 하나가 커널 스레드 하나에 대응(1:1)해서, 커널이 직접 스케줄링하고 멀티코어에 분산한다. 반면 Go의 고루틴처럼 런타임이 많은 사용자 수준 실행 단위를 적은 커널 스레드 위에 얹어 관리하는 방식도 있다.</p>
<h3>Python과 GIL</h3>
<p>일반적인 CPython에는 <strong>GIL(Global Interpreter Lock)</strong>이 있어 한 프로세스 안에서 한 번에 한 스레드만 파이썬 바이트코드를 실행한다. 그래서 순수 파이썬 계산(CPU-bound)은 스레드를 늘려도 빨라지지 않는다. 하지만 파일·네트워크 I/O를 기다리는 동안이나 numpy 같은 C 확장이 큰 연산을 하는 동안에는 GIL을 놓으므로, <strong>I/O-bound 작업에는 스레드가 효과적</strong>이다. CPU-bound 병렬화에는 <code>multiprocessing</code>(별도 프로세스)을 쓰는 것이 전통적인 방법이다. Python 3.13부터는 GIL을 끈 실험적 빌드(free-threaded)도 제공된다.</p>`,
      analogy: R`<p>프로세스가 <strong>하나의 사무실</strong>이라면 스레드는 그 사무실의 <strong>직원들</strong>이다. 직원들은 사무실의 서류함(힙)과 복사기(열린 파일)를 함께 쓰고, 각자의 메모장(스택)과 지금 하던 일의 위치(프로그램 카운터)만 따로 가진다. 서류를 건네기는 쉽지만, 두 사람이 같은 장부를 동시에 고치면 기록이 엉킨다. 다른 사무실(프로세스)과 일하려면 우편(IPC)을 보내야 한다.</p>`,

import threading, time

def io_task():
    time.sleep(0.5)                   # I/O 대기 흉내: 기다리는 동안 GIL을 놓는다

def cpu_task():
    s = 0
    for i in range(3_000_000):        # 순수 파이썬 계산: GIL을 쥔 채 실행
        s += i

def sequential(task, n):
    t0 = time.perf_counter()
    for _ in range(n):
        task()
    return time.perf_counter() - t0

def threaded(task, n):
    ts = [threading.Thread(target=task) for _ in range(n)]
    t0 = time.perf_counter()
    for t in ts: t.start()
    for t in ts: t.join()
    return time.perf_counter() - t0

cpu_task()                            # 워밍업 (첫 실행의 부가 비용 제외)
# 일반(GIL이 있는) CPython 기준 결과
for name, task in [("I/O 작업", io_task), ("CPU 작업", cpu_task)]:
    print(f"{name} 4개: 순차 {sequential(task, 4):.2f}s / 스레드 4개 {threaded(task, 4):.2f}s")

shared = []                           # 같은 주소 공간 → 모든 스레드가 같은 리스트 객체를 본다
ts = [threading.Thread(target=shared.append, args=(k,)) for k in range(5)]
for t in ts: t.start()
for t in ts: t.join()
print("스레드들이 함께 채운 리스트:", sorted(shared))

      body: R`
<h3>이중 모드: 왜 직접 못 하게 막는가</h3>
<p>CPU는 최소 두 가지 모드로 실행된다. <strong>커널 모드</strong>에서는 모든 명령(입출력 장치 제어, 페이지 테이블 변경, 인터럽트 설정 등 특권 명령)을 실행할 수 있고, <strong>사용자 모드</strong>에서는 특권 명령을 실행하면 하드웨어가 예외를 일으켜 OS로 넘긴다. 아무 프로그램이나 디스크를 직접 읽거나 다른 프로세스의 메모리 매핑을 바꿀 수 있다면 보호와 격리가 불가능하기 때문이다.</p>
<h3>시스템 콜의 동작</h3>
<ol>
<li>프로그램이 시스템 콜 번호와 인자를 레지스터에 넣고 트랩 명령(x86-64의 <code>syscall</code> 등)을 실행한다.</li>
<li>CPU가 커널 모드로 바뀌고, 커널이 미리 등록해 둔 진입점으로 점프한다. 사용자가 임의의 커널 주소로 뛰어들 수는 없다.</li>
<li>커널이 번호로 처리 함수를 찾고, 인자와 권한을 검사한 뒤 일을 한다(파일 읽기, 프로세스 생성 등).</li>
<li>결과를 돌려주며 사용자 모드로 복귀한다.</li>
</ol>
<p>Python의 <code>open()</code>, <code>f.read()</code>, <code>socket.recv()</code>, <code>os.getpid()</code>는 결국 <code>open</code>·<code>read</code>·<code>recv</code>·<code>getpid</code> 같은 시스템 콜을 부른다. 하나의 비용은 크지 않지만 일반 함수 호출보다는 훨씬 비싸므로, <strong>호출 횟수를 줄이는 것</strong>이 중요하다. 파일을 1바이트씩 쓸 때 매번 시스템 콜을 하는 대신 메모리 버퍼에 모아 한 번에 쓰는 <strong>버퍼링</strong>이 그 예다.</p>
<h3>트랩과 인터럽트</h3>
<p>커널로 진입하는 경로는 셋이다. 프로그램이 의도적으로 요청하는 <strong>시스템 콜</strong>, 0으로 나누기나 잘못된 메모리 접근(페이지 폴트 포함) 같은 <strong>예외</strong>, 그리고 장치·타이머가 보내는 비동기 신호인 <strong>인터럽트</strong>. 특히 <strong>타이머 인터럽트</strong> 덕분에 무한 루프를 도는 프로그램이 있어도 OS가 주기적으로 제어권을 되찾아 다른 프로세스를 실행할 수 있다(선점형 스케줄링의 전제).</p>
<h3>문맥 교환</h3>
<p>실행 중인 프로세스(또는 스레드)를 다른 것으로 바꾸는 작업이다. 현재 레지스터·프로그램 카운터를 PCB에 저장하고, 다음 실행할 것의 값을 복원한다. 비용은 두 가지다.</p>
<ul>
<li><strong>직접 비용</strong>: 저장·복원과 스케줄러 실행 시간. 이 동안은 아무 사용자 작업도 진행되지 않는다.</li>
<li><strong>간접 비용</strong>: 새로 실행되는 흐름은 자기 데이터가 CPU 캐시와 TLB에 없어서 한동안 미스가 많다. 프로세스 간 전환은 주소 공간도 바꾸므로 TLB 효과가 더 크게 줄어든다(일부 CPU는 주소 공간 태그로 이를 완화한다).</li>
</ul>
<p>그래서 같은 프로세스 안의 스레드 전환이 프로세스 전환보다 싸고, 스케줄러의 타임 퀀텀을 너무 작게 잡으면 문맥 교환 오버헤드가 실제 작업 시간을 잠식한다.</p>`,

import io, os, tempfile, time

path = os.path.join(tempfile.mkdtemp(), "out.bin")
N = 200_000

# 1) 1바이트마다 write 시스템 콜 (버퍼 없음)
fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC)
t0 = time.perf_counter()
for _ in range(N):
    os.write(fd, b"x")                    # 매번 사용자 모드 → 커널 모드 → 복귀
os.close(fd)
t_raw = time.perf_counter() - t0

# 2) 버퍼링: 파이썬 내부 버퍼가 찰 때만 write 시스템 콜
t0 = time.perf_counter()
with open(path, "wb") as f:
    for _ in range(N):
        f.write(b"x")
t_buf = time.perf_counter() - t0

print(f"버퍼 크기 {io.DEFAULT_BUFFER_SIZE}바이트 → 시스템 콜 약 {N // io.DEFAULT_BUFFER_SIZE + 1}번")
print(f"시스템 콜 {N}번: {t_raw:.3f}s  /  버퍼링: {t_buf:.3f}s  →  약 {t_raw / t_buf:.0f}배 차이")

      body: R`
<h3>무엇을 최적화하는가</h3>
<ul>
<li><strong>반환 시간</strong>(도착 → 완료)과 <strong>대기 시간</strong>(준비 큐에서 기다린 시간의 합): 배치 작업에서 중요.</li>
<li><strong>응답 시간</strong>(도착 → 처음 실행): 대화형 프로그램에서 중요. 사용자는 끝나는 시간보다 "반응이 있는가"를 먼저 느낀다.</li>
<li><strong>공정성</strong>과 <strong>기아 방지</strong>: 어떤 프로세스도 무한히 기다리지 않아야 한다.</li>
</ul>
<p>또 프로세스는 CPU를 오래 쓰는 <strong>CPU-bound</strong>와, 짧게 쓰고 I/O를 기다리는 <strong>I/O-bound</strong>로 나뉜다. I/O-bound 프로세스를 빨리 실행해 주면 곧바로 I/O를 시작해 CPU와 장치가 함께 바빠지므로 시스템 전체 효율이 오른다.</p>
<h3>주요 알고리즘과 그 대가</h3>
<ul>
<li><strong>FCFS</strong>(먼저 온 순서): 단순하지만 긴 작업 하나가 앞에 있으면 짧은 작업들이 줄줄이 기다린다(<strong>호위 효과</strong>, convoy effect).</li>
<li><strong>SJF</strong>(가장 짧은 작업 먼저): 모든 작업이 동시에 도착하면 평균 대기 시간을 최소로 한다. 짧은 작업을 긴 작업 앞으로 옮기면 짧은 작업의 대기 감소가 긴 작업의 대기 증가보다 크기 때문이다(교환 논증). 문제는 <strong>다음 CPU 사용 시간을 미리 알 수 없다</strong>는 것 — 과거 사용 시간의 지수 평균으로 예측한다. 선점형 버전은 SRTF. 긴 작업이 기아에 빠질 수 있다.</li>
<li><strong>우선순위</strong>: 낮은 우선순위가 영원히 밀리는 기아가 생기므로, 오래 기다릴수록 우선순위를 올리는 <strong>에이징</strong>을 쓴다.</li>
<li><strong>라운드 로빈(RR)</strong>: 정해진 타임 퀀텀만큼 실행하고 큐 뒤로 보낸다. 응답 시간이 좋고 공정하다. 퀀텀이 너무 크면 FCFS와 같아지고, 너무 작으면 문맥 교환 오버헤드가 커진다. 평균 반환 시간은 SJF보다 보통 나쁘다.</li>
<li><strong>MLFQ</strong>(다단계 피드백 큐): 작업 길이를 모르는 문제를 <strong>관찰로</strong> 푼다. 새 작업은 높은 우선순위에서 시작하고, 퀀텀을 다 써 버리면(CPU-bound로 보임) 우선순위를 내린다. 퀀텀 전에 I/O로 CPU를 양보하는 대화형 작업은 높은 우선순위에 남는다. 낮은 큐의 기아를 막기 위해 주기적으로 모두의 우선순위를 다시 올린다.</li>
</ul>
<h3>실제 OS</h3>

      code: R`
from collections import deque

def fcfs(bursts):                         # 모두 시각 0에 도착했다고 가정
    t, wait = 0, {}
    for p, b in bursts.items():
        wait[p] = t
        t += b
    return wait

def sjf(bursts):
    return fcfs(dict(sorted(bursts.items(), key=lambda kv: kv[1])))

def round_robin(bursts, q):
    remain, t, first, done = dict(bursts), 0, {}, {}
    ready = deque(bursts)
    while ready:
        p = ready.popleft()
        first.setdefault(p, t)            # 처음 CPU를 받은 시각 = 응답 시간
        run = min(q, remain[p])
        t += run
        remain[p] -= run
        if remain[p]:
            ready.append(p)               # 퀀텀을 다 쓰면 큐 맨 뒤로
        else:
            done[p] = t
    wait = {p: done[p] - bursts[p] for p in bursts}   # 반환 시간 - 실행 시간
    return wait, first

bursts = {"P1": 24, "P2": 3, "P3": 3}
avg = lambda d: sum(d.values()) / len(d)
print("FCFS 대기:", fcfs(bursts), "평균", avg(fcfs(bursts)))
print("SJF  대기:", sjf(bursts), "평균", avg(sjf(bursts)))
for q in (1, 4, 30):
    w, r = round_robin(bursts, q)
    print(f"RR(q={q:2d}) 평균 대기 {avg(w):5.2f} / 평균 응답 {avg(r):5.2f}")

      body: R`
<h3>왜 count += 1 이 깨지는가</h3>
<p><code>count += 1</code>은 한 줄이지만 실제로는 <strong>읽기 → 더하기 → 쓰기</strong> 세 단계다. 두 스레드가 동시에 5를 읽고 각자 6을 쓰면, 두 번 증가했는데 결과는 6이다(갱신 손실). 이처럼 결과가 스레드 실행의 끼어들기 순서에 의존하는 상황을 <strong>경쟁 상태(race condition)</strong>라 하고, 공유 자원에 접근하는 코드 구간을 <strong>임계 구역</strong>이라 한다.</p>
<p>임계 구역 문제의 해법은 세 조건을 만족해야 한다: <strong>상호 배제</strong>(한 번에 하나만 들어감), <strong>진행</strong>(아무도 안 쓰면 들어가려는 누군가는 들어갈 수 있음), <strong>한정 대기</strong>(무한히 기다리는 스레드가 없음).</p>
<h3>하드웨어의 도움: 원자적 명령</h3>
<p>"락이 비었는지 확인하고 → 잡는다"도 두 단계라 소프트웨어만으로는 같은 문제가 생긴다. 그래서 CPU는 읽기와 쓰기를 쪼개지지 않는 하나의 연산으로 수행하는 <strong>원자적 명령</strong>(test-and-set, compare-and-swap 등)을 제공하고, 모든 락은 이 위에 만들어진다.</p>
<h3>뮤텍스(락)</h3>
<p>임계 구역 앞에서 획득하고 끝나면 해제한다. 이미 잡혀 있으면 기다린다. 기다리는 방법은 두 가지다.</p>
<ul><li><strong>스핀락</strong>: 반복해서 확인하며 CPU를 쓴다. 임계 구역이 매우 짧고 멀티코어일 때는 잠들었다 깨는 비용보다 싸다.</li>
<li><strong>블로킹 락</strong>: 대기 큐에서 잠들고, 해제 시 깨운다. 오래 기다릴 때 CPU를 낭비하지 않는다.</li></ul>
<h3>세마포어</h3>
<p>정수 카운터와 두 연산 <code>wait</code>(P: 0이면 기다리고, 아니면 1 감소)·<code>signal</code>(V: 1 증가, 기다리는 스레드를 깨움)이다. 값이 1이면 뮤텍스처럼, N이면 <strong>"동시에 최대 N개까지"</strong>를 표현한다(DB 연결 풀, 동시 다운로드 수 제한). 뮤텍스는 잡은 스레드가 풀어야 한다는 소유권 개념이 있지만, 세마포어는 다른 스레드가 signal할 수 있어 "이벤트가 일어났다"는 신호 전달에도 쓰인다.</p>
<h3>조건 변수와 모니터</h3>
<p>"버퍼에 데이터가 생길 때까지 기다리기"처럼 <strong>조건</strong>을 기다려야 할 때, 락을 쥔 채 반복 확인하면 다른 스레드가 조건을 만들 수 없다. 조건 변수의 <code>wait</code>은 <strong>락을 놓고 잠든 뒤, 깨어나면 락을 다시 잡고</strong> 돌아온다. 깨어났다고 조건이 성립한다는 보장은 없으므로(다른 스레드가 먼저 가져갔거나, 이유 없이 깨는 경우) 항상 <code>while</code>로 조건을 다시 확인한다. 생산자-소비자(유한 버퍼) 문제가 대표적이며, Python <code>queue.Queue</code>는 내부적으로 락과 조건 변수로 이를 구현한다.</p>
<h3>Python에서도 락이 필요하다</h3>
<p>GIL은 인터프리터 내부 상태를 보호할 뿐, <code>+=</code> 같은 여러 바이트코드로 이뤄진 연산의 원자성을 보장하지 않는다. 바이트코드 사이에서 스레드가 바뀔 수 있으므로 공유 데이터 갱신에는 <code>threading.Lock</code>을 써야 한다.</p>
<h3>동기화의 비용</h3>
<p>락은 병렬 구간을 직렬화하므로 경합이 심하면 성능이 떨어지고, 여러 락을 잘못 조합하면 교착 상태가 생긴다. 또 멀티코어에서는 코어마다 캐시가 있어 한 코어의 쓰기가 다른 코어에 보이는 시점이 보장되지 않을 수 있는데, 락 획득·해제는 이러한 메모리 가시성도 보장해 준다.</p>`,

      code: R`
import threading, time

N, THREADS = 1000, 4
counter = 0
lock = threading.Lock()

def unsafe():
    global counter
    for _ in range(N):
        tmp = counter                 # 1) 읽기
        time.sleep(0)                 # 이 사이에 다른 스레드로 전환되기 쉽게 만든다
        counter = tmp + 1             # 2) 쓰기 — 그 사이의 다른 갱신을 덮어쓴다

def safe():
    global counter
    for _ in range(N):
        with lock:                    # 임계 구역: 한 번에 한 스레드만
            tmp = counter
            time.sleep(0)
            counter = tmp + 1

for f in (unsafe, safe):
    counter = 0
    ts = [threading.Thread(target=f) for _ in range(THREADS)]
    for t in ts: t.start()
    for t in ts: t.join()
    print(f"{f.__name__:6s}: 기대값 {N * THREADS}, 실제 {counter}")

# 카운팅 세마포어: 동시에 최대 2개까지만 실행
sem, active, peak = threading.Semaphore(2), 0, 0
state_lock = threading.Lock()
def limited():
    global active, peak
    with sem:
        with state_lock:
            active += 1; peak = max(peak, active)
        time.sleep(0.05)
        with state_lock:
            active -= 1
ts = [threading.Thread(target=limited) for _ in range(8)]
for t in ts: t.start()
for t in ts: t.join()
print("세마포어(2) 아래 동시 실행 최대 개수:", peak)

<h3>네 가지 필요 조건</h3>
<ol>
<li><strong>상호 배제</strong>: 자원을 한 번에 하나만 쓸 수 있다.</li>
<li><strong>점유와 대기</strong>: 자원을 가진 채로 다른 자원을 기다린다.</li>
<li><strong>비선점</strong>: 남이 가진 자원을 강제로 빼앗을 수 없다.</li>
<li><strong>순환 대기</strong>: T1은 T2의 자원을, T2는 T1의 자원을 기다리는 식의 사이클이 있다.</li>
</ol>
<p>네 조건은 <strong>모두</strong> 성립해야 교착이 생긴다(필요 조건). 따라서 대처 전략도 "어떤 조건을 깰 것인가"로 정리된다.</p>
<h3>자원 할당 그래프</h3>
<p>실행 흐름과 자원을 정점으로, "요청"(흐름 → 자원)과 "할당"(자원 → 흐름)을 간선으로 그린다. 사이클이 없으면 교착도 없다. 각 자원이 하나뿐이라면 사이클 = 교착이고, 같은 종류의 자원이 여러 개라면 사이클이 있어도 교착이 아닐 수 있다(다른 인스턴스가 풀려날 수 있으므로). 교착 탐지는 결국 그래프의 사이클 탐지 문제다.</p>
<h3>네 가지 대응 전략</h3>
<ul>
<li><strong>예방</strong>: 조건 하나를 구조적으로 불가능하게 만든다. 가장 실용적인 것은 <strong>모든 락에 전역 순서를 정하고 항상 그 순서로 획득</strong>하는 것이다(순환 대기 제거). 필요한 자원을 한 번에 모두 요청하는 방식(점유와 대기 제거)은 자원 활용률이 떨어진다.</li>
<li><strong>회피</strong>: 요청을 들어줬을 때 시스템이 여전히 <strong>안전 상태</strong>(모두가 끝날 수 있는 실행 순서가 존재)인지 검사하고, 아니면 기다리게 한다. 은행원 알고리즘이 대표적이지만 각 프로세스의 <strong>최대 요구량을 미리 알아야</strong> 하고 매 요청마다 검사 비용이 들어 범용 OS에서는 거의 쓰지 않는다.</li>
<li><strong>탐지와 회복</strong>: 일단 허용하고 주기적으로(또는 대기가 길어질 때) 대기 그래프의 사이클을 찾아, 희생자를 골라 중단·롤백한다. <strong>관계형 DB</strong>가 이 방식으로, 교착을 감지하면 트랜잭션 하나를 롤백하고 오류를 돌려준다.</li>
<li><strong>무시</strong>: 드물게 발생한다고 보고 별도 처리를 하지 않는다(일명 타조 알고리즘). 범용 OS 커널은 응용 프로그램의 락 사용에 대해 대체로 이 입장이고, 책임은 프로그래머에게 있다.</li>
</ul>
<h3>비슷하지만 다른 것</h3>
<p><strong>기아</strong>는 진행은 되지만 특정 흐름만 계속 밀리는 것, <strong>라이브락</strong>은 서로 양보하느라 계속 상태는 바뀌지만 아무도 진행하지 못하는 것이다(복도에서 서로 같은 방향으로 비켜 주는 두 사람).</p>
<h3>실무 지침</h3>
<p>락 순서를 문서화하고 지킨다, 락을 쥔 채로 외부 호출·I/O를 하지 않는다, 락을 잡는 범위를 최소화한다, 필요하면 타임아웃이 있는 획득(<code>acquire(timeout=...)</code>)으로 무한 대기를 막고 재시도한다.</p>`,

import threading, time

a, b = threading.Lock(), threading.Lock()

def worker(name, first, second, log):
    with first:
        time.sleep(0.1)                         # 상대가 다른 락을 잡을 시간을 준다
        if second.acquire(timeout=1):           # 진짜 교착이면 영원히 기다림 → 타임아웃으로 탐지
            second.release()
            log.append(f"{name} 성공")
        else:
            log.append(f"{name} 1초 대기 후 포기")

def run(order1, order2):
    log = []
    ts = [threading.Thread(target=worker, args=("T1", *order1, log)),
          threading.Thread(target=worker, args=("T2", *order2, log))]
    for t in ts: t.start()
    for t in ts: t.join()
    return log

print("반대 순서로 획득:", run((a, b), (b, a)))   # 순환 대기 → 교착 → 타임아웃으로 한쪽이 포기해야 풀린다
print("같은 순서로 획득:", run((a, b), (a, b)))   # 순환 대기 조건 제거 → 정상

def is_safe(available, max_need, alloc):
    """은행원 알고리즘의 안전성 검사: 모두 끝낼 수 있는 순서를 찾는다"""
    need = [[m - x for m, x in zip(mr, ar)] for mr, ar in zip(max_need, alloc)]
    work, done, order = list(available), [False] * len(alloc), []
    progress = True
    while progress:
        progress = False
        for i in range(len(alloc)):
            if not done[i] and all(n <= w for n, w in zip(need[i], work)):
                work = [w + x for w, x in zip(work, alloc[i])]   # i가 끝나며 자원 반납
                done[i] = progress = True
                order.append(f"P{i}")
    return all(done), order

max_need = [[7, 5, 3], [3, 2, 2], [9, 0, 2], [2, 2, 2], [4, 3, 3]]
alloc    = [[0, 1, 0], [2, 0, 0], [3, 0, 2], [2, 1, 1], [0, 0, 2]]
print("여유 (3,3,2):", is_safe([3, 3, 2], max_need, alloc))
print("여유 (0,1,0):", is_safe([0, 1, 0], max_need, alloc))

      body: R`
<h3>왜 물리 주소를 직접 쓰지 않는가</h3>
<ul>
<li><strong>격리</strong>: 프로세스가 물리 주소를 직접 쓰면 다른 프로세스의 메모리를 읽고 쓸 수 있다.</li>
<li><strong>재배치</strong>: 프로그램이 물리 메모리 어디에 올라가든 같은 주소로 동작해야 한다.</li>
<li><strong>연속성의 착시</strong>: 물리 메모리는 조각조각 비어 있어도, 프로세스에게는 넓고 연속된 공간처럼 보여 줄 수 있다.</li>
</ul>
<p>그래서 CPU가 내는 모든 주소는 가상 주소이고, <strong>MMU</strong>(메모리 관리 장치)가 매 접근마다 물리 주소로 변환한다. 변환 규칙(페이지 테이블)은 OS가 관리하며, 사용자 프로세스는 바꿀 수 없다.</p>
<h3>연속 할당과 외부 단편화</h3>
<p>프로세스마다 연속된 물리 구간을 주면, 할당·해제가 반복되며 빈 공간이 작은 조각들로 흩어져 총 여유 공간은 충분한데도 큰 요청을 못 들어주는 <strong>외부 단편화</strong>가 생긴다.</p>
<h3>페이징</h3>
<p>가상 공간을 고정 크기 <strong>페이지</strong>(흔히 4KB), 물리 메모리를 같은 크기의 <strong>프레임</strong>으로 나누고, 페이지마다 아무 프레임에나 놓는다. 모든 조각이 같은 크기라 아무 빈 프레임이나 쓸 수 있으므로 외부 단편화가 없다. 대신 마지막 페이지의 남는 부분만큼 <strong>내부 단편화</strong>가 생긴다.</p>
<p>가상 주소는 <strong>페이지 번호 + 오프셋</strong>으로 나뉜다. 4KB = $2^{12}$이므로 하위 12비트가 오프셋이다. 페이지 번호로 페이지 테이블을 찾아 프레임 번호를 얻고, 오프셋은 그대로 붙인다. 페이지 테이블 항목에는 프레임 번호 외에 유효 비트, 보호 비트(읽기/쓰기/실행), 접근(referenced)·수정(dirty) 비트가 있어 보호와 페이지 교체에 쓰인다.</p>
<h3>페이지 테이블이 너무 크다: 다단계 페이지 테이블</h3>
<p>64비트 주소 공간을 4KB 페이지로 나누면 단일 테이블은 감당할 수 없이 커진다. 하지만 실제로 쓰는 영역은 일부(코드, 힙, 스택 근처)뿐이다. 그래서 테이블을 트리처럼 여러 단계로 나누고, <strong>사용하는 영역의 하위 테이블만 할당</strong>한다. x86-64는 보통 4단계(일부 CPU는 5단계)를 쓴다.</p>
<h3>변환이 느리다: TLB</h3>
<p>다단계 테이블이면 메모리 접근 한 번에 테이블 조회로 여러 번의 메모리 접근이 더 필요하다. 그래서 MMU는 최근 변환 결과를 저장하는 작은 캐시인 <strong>TLB</strong>를 둔다. TLB가 수십~수천 항목뿐인데도 적중률이 매우 높은 이유는 <strong>지역성</strong>이다. 한 페이지(4KB) 안을 순차적으로 읽으면 첫 접근만 미스이고 나머지는 모두 적중한다. 큰 배열을 무작위로 건드리는 코드는 캐시뿐 아니라 TLB에서도 손해를 본다. 큰 페이지(2MB 등)를 쓰면 TLB 항목 하나가 덮는 범위가 넓어진다.</p>
<h3>세그멘테이션</h3>
<p>코드·데이터·스택 같은 <strong>논리적 단위</strong>로 가변 크기 구간을 나누고, 구간마다 시작 주소와 길이(경계 검사)를 둔다. 사람이 이해하는 구조와 맞고 보호 단위로 자연스럽지만, 가변 크기라 외부 단편화가 다시 생긴다. 현대 x86-64 운영체제는 사실상 페이징 중심으로 메모리를 관리한다.</p>

import random
from collections import OrderedDict

random.seed(0)
PAGE = 4096
page_table = {vpn: random.randrange(10_000) for vpn in range(256)}   # 가상 페이지 → 물리 프레임

def translate(vaddr, tlb, stats, tlb_size=16):
    vpn, offset = divmod(vaddr, PAGE)            # 상위 비트 = 페이지 번호, 하위 12비트 = 오프셋
    if vpn in tlb:
        tlb.move_to_end(vpn)
        stats["hit"] += 1
    else:
        stats["miss"] += 1
        tlb[vpn] = page_table[vpn]               # 페이지 테이블 조회 (추가 메모리 접근)
        if len(tlb) > tlb_size:
            tlb.popitem(last=False)              # 가장 오래 안 쓴 항목 제거
    return tlb[vpn] * PAGE + offset

pa = translate(0x1234, OrderedDict(), {"hit": 0, "miss": 0})
print(f"가상 0x1234 → 물리 {hex(pa)} (하위 12비트 0x234는 그대로)")

n = 256 * PAGE // 8
for name, addrs in [("순차 접근", range(0, 256 * PAGE, 8)),
                    ("무작위 접근", [random.randrange(256 * PAGE) for _ in range(n)])]:
    tlb, stats = OrderedDict(), {"hit": 0, "miss": 0}
    for a in addrs:
        translate(a, tlb, stats)
    print(f"{name}: TLB 적중률 {stats['hit'] / (stats['hit'] + stats['miss']):.1%}")

      body: R`
<h3>요구 페이징과 페이지 폴트</h3>
<p>프로그램 전체를 처음부터 메모리에 올릴 필요는 없다. 실제로 쓰는 페이지만 올리고, 페이지 테이블에서 아직 안 올린 페이지는 유효 비트를 0으로 둔다. 그 페이지에 접근하면 MMU가 <strong>페이지 폴트</strong> 예외를 일으키고, OS가 디스크에서 페이지를 읽어 빈 프레임에 올린 뒤 테이블을 고치고, <strong>폴트를 일으킨 명령을 다시 실행</strong>한다. 프로그램은 이 과정을 전혀 모른다.</p>
<p>메모리 접근은 수십~100ns 수준인데, 디스크에서 페이지를 읽는 것은 SSD여도 수십 µs 이상, HDD면 ms 단위다. 그래서 폴트 비율이 아주 조금만 올라가도 평균 접근 시간이 폭증한다(아래 EAT 식). 가상 메모리가 잘 동작하는 것은 결국 <strong>지역성</strong> 덕분이다.</p>
<h3>페이지 교체 알고리즘</h3>
<p>빈 프레임이 없으면 기존 페이지 하나를 내보내야 한다(수정된 페이지라면 디스크에 써야 하므로 더 비싸다 — <strong>dirty 비트</strong>로 판단).</p>
<ul>
<li><strong>OPT(최적)</strong>: 앞으로 가장 오랫동안 쓰이지 않을 페이지를 내보낸다. 폴트 수가 최소지만 미래를 알아야 하므로 구현 불가. 다른 알고리즘을 평가하는 기준선이다.</li>
<li><strong>FIFO</strong>: 가장 먼저 들어온 페이지를 내보낸다. 단순하지만 자주 쓰는 페이지도 오래됐다는 이유로 내보낸다. 프레임을 늘렸는데 폴트가 오히려 늘어나는 <strong>벨레이디의 이상 현상</strong>이 생길 수 있다.</li>
<li><strong>LRU</strong>: 가장 오래 사용되지 않은 페이지를 내보낸다. "최근에 안 쓴 것은 앞으로도 안 쓸 것"이라는 지역성 가정으로 OPT를 근사한다. 프레임이 많을 때의 메모리 내용이 항상 적을 때의 내용을 포함하는 성질(스택 알고리즘)이 있어 벨레이디 이상이 없다. 하지만 매 메모리 접근마다 순서를 갱신하는 것은 하드웨어적으로 너무 비싸다.</li>
<li><strong>Clock(2차 기회)</strong>: LRU의 실용적 근사. 하드웨어가 접근 시 켜 주는 <strong>참조 비트</strong>를 이용해, 시계 바늘처럼 프레임을 돌며 참조 비트가 1이면 0으로 끄고 넘어가고(한 번 더 기회), 0이면 내보낸다.</li>
</ul>
<h3>스래싱</h3>
<p>프로세스들이 활발히 쓰는 페이지 집합(작업 집합)의 합이 물리 메모리보다 커지면, 페이지를 들이자마자 다른 필요한 페이지가 쫓겨나는 일이 반복된다. CPU는 대부분의 시간을 폴트 처리를 기다리며 놀고, 이를 본 시스템이 "CPU가 한가하니" 프로세스를 더 실행하면 상황은 더 나빠진다. 해결은 동시에 실행하는 프로세스 수를 줄이거나 메모리를 늘리는 것이다.</p>
<h3>가상 메모리가 주는 다른 기능</h3>
<p><strong>메모리 매핑 파일(mmap)</strong>은 파일을 주소 공간에 매핑해 배열처럼 접근하게 하고, 실제 읽기는 페이지 폴트 때 일어난다. numpy의 <code>np.memmap</code>은 이 방식으로 메모리보다 큰 배열을 다룬다. fork의 Copy-on-Write, 실행 파일의 지연 로딩도 같은 기반 위에 있다. 반면 GPU 메모리는 일반적으로 이렇게 투명하게 디스크로 넘치지 않으므로, 딥러닝에서 메모리가 부족하면 느려지는 대신 바로 OOM 오류가 나는 경우가 많다.</p>`,

from collections import OrderedDict, deque

def fifo(refs, n):
    mem, q, faults = set(), deque(), 0
    for p in refs:
        if p not in mem:
            faults += 1
            if len(mem) == n:
                mem.remove(q.popleft())          # 가장 먼저 들어온 페이지
            mem.add(p); q.append(p)
    return faults

def lru(refs, n):
    mem, faults = OrderedDict(), 0
    for p in refs:
        if p in mem:
            mem.move_to_end(p)                   # 최근 사용으로 갱신
        else:
            faults += 1
            if len(mem) == n:
                mem.popitem(last=False)          # 가장 오래 안 쓴 페이지
            mem[p] = True
    return faults

def opt(refs, n):
    mem, faults = set(), 0
    for i, p in enumerate(refs):
        if p in mem:
            continue
        faults += 1
        if len(mem) == n:
            future = refs[i + 1:]
            mem.remove(max(mem, key=lambda q: future.index(q) if q in future else float("inf")))
        mem.add(p)                               # ↑ 가장 나중에(또는 다시는 안) 쓰일 페이지를 내보냄
    return faults

      body: R`
<h3>파일 = 메타데이터 + 데이터 블록</h3>
<p>저장 장치는 고정 크기 블록을 번호로 읽고 쓸 뿐이다. 파일 시스템은 "이 파일의 내용은 어느 블록들에 있는가"와 "크기·권한·소유자·시간" 같은 메타데이터를 관리한다. Unix 계열에서는 이것을 <strong>inode</strong>에 담는다.</p>
<p>중요한 점: <strong>파일 이름은 inode에 없다</strong>. 디렉터리는 "이름 → inode 번호" 목록을 담은 특수한 파일이다. 그래서 같은 inode를 가리키는 이름을 여러 개 만들 수 있다(<strong>하드 링크</strong>). inode는 자신을 가리키는 이름의 수(링크 수)를 세고, 링크 수가 0이 되고 그 파일을 연 프로세스도 없을 때 실제로 공간이 해제된다. 반면 <strong>심볼릭 링크</strong>는 "다른 경로 문자열"을 내용으로 가진 별도의 파일이라, 원본 경로가 사라지면 깨진다.</p>
<h3>블록을 어떻게 기록하는가</h3>
<ul>
<li><strong>연속 할당</strong>: 순차 읽기가 빠르지만 파일이 커지기 어렵고 외부 단편화가 생긴다.</li>
<li><strong>연결 할당</strong>(FAT 계열): 각 블록이 다음 블록 번호를 가리킨다. 임의 위치 접근이 느리다.</li>
<li><strong>인덱스 할당</strong>(전통적 Unix inode): inode에 <strong>직접 포인터</strong> 여러 개와, 포인터 블록을 가리키는 <strong>간접 포인터</strong>(단일·이중·삼중)를 둔다. 대부분의 파일은 작아서 직접 포인터만으로 빠르게 접근하고, 큰 파일은 간접 단계로 지원한다. 비대칭 분포(작은 파일이 많고 큰 파일은 드묾)에 맞춘 설계다.</li>
<li><strong>익스텐트</strong>(ext4 등): "시작 블록 + 길이"로 연속 구간을 한 번에 기록해 큰 파일의 메타데이터를 줄인다.</li>
</ul>
<h3>열린 파일과 파일 디스크립터</h3>
<p><code>open()</code>은 프로세스별 파일 디스크립터 테이블에 항목을 만들고 작은 정수(fd)를 돌려준다. 이 항목은 커널의 열린 파일 객체(현재 오프셋, 열기 모드)를 거쳐 inode를 가리킨다. 같은 파일을 두 번 열면 오프셋을 따로 가진다.</p>
<h3>페이지 캐시와 fsync</h3>
<p>디스크는 느리므로 커널은 파일 데이터를 메모리(페이지 캐시)에 보관한다. 같은 파일을 다시 읽으면 디스크를 거치지 않는다. 쓰기도 보통 캐시에만 기록하고 나중에 디스크에 반영한다(write-back). 그래서 <code>write()</code>가 성공해도 <strong>전원이 나가면 사라질 수 있다</strong>. 반드시 디스크에 있어야 하는 데이터(DB 로그 등)는 <code>fsync()</code>로 강제로 내려 쓴다.</p>
<h3>크래시 일관성: 저널링</h3>
<p>파일에 블록 하나를 추가하는 것도 "데이터 블록 쓰기, inode 갱신, 빈 블록 비트맵 갱신" 여러 번의 쓰기다. 중간에 전원이 꺼지면 inode는 블록을 가리키는데 비트맵은 빈 블록으로 표시하는 등 불일치가 생긴다. <strong>저널링</strong>은 변경 내용을 먼저 저널(로그) 영역에 기록하고, 완료 표시를 한 뒤에 실제 위치에 반영한다. 재부팅 시 완료 표시된 저널만 다시 적용하면 일관된 상태가 된다. DB의 WAL(Write-Ahead Logging)과 같은 아이디어다. btrfs·ZFS·APFS 같은 파일 시스템은 기존 블록을 덮어쓰지 않고 새 위치에 쓰는 Copy-on-Write 방식으로 일관성을 얻는다.</p>
<h3>데이터 작업과의 연결</h3>
<p>작은 파일 수백만 개로 된 데이터셋이 느린 이유는 파일마다 경로 탐색, inode 조회, open/close 시스템 콜이 필요하기 때문이다. 그래서 대규모 학습 데이터는 큰 파일 여러 개로 묶은 형식(샤딩된 Parquet, TFRecord, WebDataset 등)으로 저장하는 경우가 많다.</p>`,
      analogy: R`<p>도서관. 책장(디스크 블록)에 꽂힌 책을 찾으려면 <strong>카드 목록(inode)</strong>에 "어느 서가 몇 번째 칸"이 적혀 있어야 한다. 제목 색인(디렉터리)은 "제목 → 카드 번호"만 알려 준다. 같은 카드를 가리키는 제목이 둘이면 하드 링크, "○○ 제목의 책을 보시오"라는 메모 카드가 심볼릭 링크다. 사서가 반납 처리를 장부에 먼저 적어 두고 나중에 책장을 정리하는 것이 저널링이다.</p>`,

<h3>장치와 대화하는 방법</h3>
<p>각 장치에는 컨트롤러가 있고, CPU는 컨트롤러의 상태·명령·데이터 레지스터를 읽고 써서 장치를 제어한다. 문제는 "작업이 끝났는지 어떻게 아는가"다.</p>
<ul>
<li><strong>폴링</strong>: CPU가 상태 레지스터를 반복해서 확인한다. 장치가 아주 빠르면 오히려 가장 효율적이지만, 느린 장치라면 CPU 시간을 낭비한다(바쁜 대기).</li>
<li><strong>인터럽트</strong>: CPU는 다른 일을 하고, 장치가 끝나면 신호를 보낸다. CPU는 현재 상태를 저장하고 인터럽트 핸들러를 실행한 뒤 원래 작업으로 돌아간다. 다만 인터럽트 처리에도 비용이 있어서, 초당 수백만 개 패킷이 오는 고속 네트워크에서는 인터럽트가 너무 잦아 오히려 성능이 떨어진다. 그래서 부하가 높을 때는 폴링으로 전환하는 하이브리드 방식(Linux 네트워크의 NAPI 등)을 쓴다.</li>
<li><strong>DMA</strong>: 큰 데이터를 옮길 때 CPU가 한 단어씩 복사하면 그 시간 내내 CPU가 묶인다. DMA 컨트롤러가 장치와 메모리 사이를 <strong>직접</strong> 복사하고, 전체가 끝났을 때 인터럽트를 한 번만 보낸다. 디스크·네트워크·GPU 데이터 전송의 기본이다.</li>
</ul>
<h3>속도 차이의 감각</h3>
<p>대략적인 자릿수로, CPU 캐시 접근은 ns 이하~수 ns, 메인 메모리는 약 100ns, NVMe SSD 읽기는 수십~수백 µs, HDD 탐색은 ms 단위, 다른 대륙 서버와의 왕복은 수십~수백 ms다. 디스크나 네트워크를 한 번 기다리는 동안 CPU는 수십만~수억 개의 명령을 실행할 수 있다. I/O 설계의 목표는 이 시간을 다른 일로 채우는 것이다.</p>
<h3>프로그램 입장의 I/O 모델</h3>
<ul>
<li><strong>블로킹</strong>: <code>read()</code>를 부르면 데이터가 올 때까지 스레드가 대기 상태로 잠든다. 코드는 단순하지만, 연결 1만 개를 동시에 처리하려면 스레드 1만 개가 필요하다.</li>
<li><strong>논블로킹</strong>: 준비된 데이터가 없으면 즉시 "아직 없음"을 반환한다. 계속 다시 물어보면 폴링이 된다.</li>
<li><strong>I/O 다중화</strong>: <code>select</code>/<code>poll</code>/<code>epoll</code>(Linux)/<code>kqueue</code>(macOS·BSD)로 <strong>스레드 하나가 수많은 소켓을 감시</strong>하다가 준비된 것만 처리한다. 고성능 웹 서버와 Node.js, Python asyncio의 이벤트 루프가 이 방식이다.</li>
<li><strong>비동기 I/O</strong>: 요청만 등록하고 완료되면 통지받는다(Linux io_uring, Windows IOCP 등).</li>
</ul>
<h3>Python asyncio</h3>
<p><code>async</code>/<code>await</code>는 코루틴이 I/O를 기다리는 지점에서 제어권을 이벤트 루프에 돌려주고, 루프는 준비된 다른 코루틴을 실행한다. 스레드 하나로 수천 개의 동시 연결을 처리할 수 있다. 하지만 코루틴 안에서 <code>time.sleep()</code>이나 동기식 <code>requests.get()</code> 같은 <strong>블로킹 호출</strong>을 하면 루프 전체가 멈춘다. 또 CPU 계산은 기다림이 없으므로 asyncio로 빨라지지 않는다.</p>
<h3>ML과의 연결</h3>
<p>딥러닝 학습에서 GPU가 데이터 로딩(디스크 읽기, 디코딩, 증강)을 기다리면 비싼 GPU가 논다. PyTorch <code>DataLoader</code>의 여러 워커 프로세스와 미리 가져오기(prefetch)는 I/O·전처리와 GPU 계산을 겹쳐 실행하려는 것으로, 위의 "기다리는 시간을 다른 일로 채우기"와 같은 원리다.</p>`,
      analogy: R`<p>배달 음식 기다리기. <strong>폴링</strong>은 1분마다 현관문을 열어 확인하는 것, <strong>인터럽트</strong>는 초인종이 울릴 때까지 다른 일을 하는 것, <strong>DMA</strong>는 장 본 물건 수십 개를 배달 기사가 냉장고까지 직접 넣어 주고 다 끝나면 한 번만 알려 주는 것이다. <strong>asyncio</strong>는 요리사 한 명이 여러 냄비를 올려 두고 끓는 냄비만 돌보는 방식 — 한 냄비 앞에서 멍하니 서 있으면(블로킹 호출) 다른 냄비가 모두 탄다.</p>`,

import asyncio, time

async def fetch(i):
    await asyncio.sleep(0.2)          # I/O 대기 흉내: 기다리는 동안 이벤트 루프가 다른 코루틴을 실행
    return i

async def blocking(i):
    time.sleep(0.2)                   # 블로킹 호출: 이벤트 루프 전체가 멈춘다
    return i

async def main():
    t0 = time.perf_counter()
    results = await asyncio.gather(*(fetch(i) for i in range(100)))
    print(f"비동기 대기 100개: {time.perf_counter() - t0:.2f}s (결과 {len(results)}개)")

    t0 = time.perf_counter()
    await asyncio.gather(*(blocking(i) for i in range(5)))
    print(f"코루틴 안의 블로킹 호출 5개: {time.perf_counter() - t0:.2f}s (순차 실행과 같다)")

t0 = time.perf_counter()
for _ in range(5):
    time.sleep(0.2)
print(f"순차 블로킹 5개: {time.perf_counter() - t0:.2f}s")
asyncio.run(main())

      body: R`
<h3>2진수와 16진수</h3>
<p>트랜지스터는 켜짐/꺼짐 두 상태를 안정적으로 구분하므로 컴퓨터는 2진수를 쓴다. 16진수는 4비트를 한 글자로 묶은 표기일 뿐이다(<code>0xFF</code> = <code>1111 1111</code>). 메모리 주소, 색상 코드, 바이트 덤프를 16진수로 쓰는 이유는 비트 경계와 정확히 맞기 때문이다.</p>
<h3>음수: 왜 2의 보수인가</h3>
<p>최상위 비트를 부호로 쓰는 방법(부호-크기)이나 비트를 모두 뒤집는 1의 보수는 <strong>+0과 −0이 따로 존재</strong>하고, 덧셈 회로와 별도로 부호 처리가 필요하다. <strong>2의 보수</strong>는 $-x$를 "비트를 모두 뒤집고 1을 더한 값"으로 표현한다. 이렇게 하면</p>
<ul>
<li>0이 하나뿐이다.</li>
<li>부호 있는 수와 부호 없는 수의 덧셈이 <strong>같은 회로</strong>로 된다. 뺄셈은 "보수를 더하기"로 처리되어 별도 뺄셈기가 필요 없다.</li>
<li>$n$비트로 $-2^{n-1}$ ~ $2^{n-1}-1$을 표현한다. 최상위 비트의 자릿값을 $-2^{n-1}$로 보면 된다.</li>
</ul>
<p>범위를 넘으면 <strong>오버플로</strong>로 값이 반대편으로 돌아간다(8비트에서 127 + 1 = −128). Python의 <code>int</code>는 필요한 만큼 자릿수를 늘리는 임의 정밀도라 오버플로가 없지만, numpy의 <code>int8</code>·<code>int32</code> 배열은 하드웨어 정수를 그대로 쓰므로 조용히 돌아간다.</p>
<h3>실수: IEEE 754 부동소수점</h3>
<p>실수는 과학적 표기법처럼 $(-1)^s \times 1.f \times 2^{e - \text{bias}}$로 저장한다. 부호 1비트, 지수 $e$(편향값을 더해 부호 없이 저장), 가수 $f$(맨 앞의 1은 항상 1이라 저장하지 않음). float32는 1/8/23비트, float64는 1/11/52비트다.</p>
<ul>
<li><strong>지수 비트</strong>는 표현 가능한 <strong>범위</strong>(얼마나 크고 작은 수까지)를, <strong>가수 비트</strong>는 <strong>정밀도</strong>(유효숫자 몇 자리)를 결정한다.</li>
<li>상대 정밀도가 일정하다. 즉 수가 커질수록 표현 가능한 수 사이의 <strong>간격도 커진다</strong>. float64에서 $10^{16}$ 근처의 간격은 2라서 $10^{16} + 1$은 $10^{16}$과 구별되지 않는다.</li>
</ul>
<h3>0.1 + 0.2 != 0.3</h3>
<p>10진수 0.1은 2진수로 $0.000110011\ldots$ 무한 반복 소수다. 유한한 가수에 맞춰 반올림하므로 처음부터 정확한 0.1이 아니다. 오차가 누적되어 <code>0.1 + 0.2</code>는 <code>0.30000000000000004</code>가 된다. 그래서 실수 비교는 <code>==</code>가 아니라 <code>math.isclose</code>·<code>np.allclose</code>로 하고, 돈 계산은 정수(원 단위)나 <code>decimal</code>을 쓴다.</p>
<p>또 반올림 때문에 <strong>결합법칙이 성립하지 않는다</strong>: $(a + b) + c \ne a + (b + c)$일 수 있다. GPU처럼 여러 스레드가 순서를 바꿔 가며 합을 구하면 실행할 때마다 결과의 마지막 자리가 조금씩 달라질 수 있는 이유다. 특수값으로 $\pm\infty$와 NaN(정의되지 않은 결과, <code>NaN != NaN</code>)이 있다.</p>
<h3>딥러닝과 정밀도</h3>
<ul>
<li><strong>float16</strong>(1/5/10): 메모리와 연산량이 절반이지만 지수가 5비트라 최댓값이 65504로 작고, 아주 작은 그래디언트는 0이 되어 버린다(언더플로). 그래서 손실에 큰 수를 곱했다가 되돌리는 loss scaling을 함께 쓴다.</li>
<li><strong>bfloat16</strong>(1/8/7): float32와 <strong>지수 비트 수가 같아 범위가 같고</strong> 정밀도만 낮다. 범위 문제가 거의 없어 학습에 많이 쓰인다.</li>
<li><strong>int8·4비트 양자화</strong>: 추론 시 가중치를 정수로 바꿔 메모리와 대역폭을 줄인다.</li>
</ul>
<p>수치 안정성 기법도 표현 한계에서 나온다. 소프트맥스에서 $e^{1000}$은 float64로도 무한대가 되므로, 모든 입력에서 최댓값을 빼고 계산한다(결과는 수학적으로 같다).</p>`,
      analogy: R`<p>부동소수점은 <strong>유효숫자 7자리만 적을 수 있는 계산기</strong>와 같다. 1,234,567과 0.0001234567은 둘 다 정확히 적을 수 있지만, 1,234,567 + 0.0001은 적을 자리가 없어 그냥 1,234,567이 된다. 2의 보수는 <strong>자동차 주행 거리계</strong>와 비슷하다. 000에서 한 칸 뒤로 돌리면 999가 되듯, 0에서 1을 빼면 모든 비트가 1인 값(= −1)이 된다.</p>`,

<h3>폰 노이만 구조</h3>
<p>프로그램(명령어)도 데이터처럼 메모리에 저장해 두고, CPU가 하나씩 읽어 실행한다(내장 프로그램 방식). 덕분에 프로그램을 바꾸려고 배선을 다시 할 필요가 없고, 컴파일러처럼 "프로그램을 만드는 프로그램"이 가능하다. 대가는 명령어와 데이터가 같은 통로로 메모리를 오가야 한다는 것이다. CPU는 점점 빨라졌지만 메모리는 그만큼 빨라지지 않아서, CPU가 메모리를 기다리는 <strong>폰 노이만 병목</strong>이 생겼다. 캐시, 프리페치, 파이프라인, 비순차 실행은 모두 이 병목을 숨기려는 노력이다. 명령어와 데이터용 메모리를 분리하는 하버드 구조의 아이디어도 현대 CPU의 L1 캐시(명령어 캐시와 데이터 캐시 분리)에 쓰인다.</p>
<h3>구성 요소</h3>
<ul>
<li><strong>ALU</strong>: 덧셈, 비트 연산, 비교 같은 산술·논리 연산. 결과와 함께 0인지(Z), 음수인지(N), 자리올림(C), 부호 있는 오버플로(V) 같은 <strong>상태 플래그</strong>를 남긴다. 조건 분기는 이 플래그를 본다.</li>
<li><strong>제어장치</strong>: 명령어를 해독해 ALU·레지스터·메모리에 어떤 동작을 할지 제어 신호를 보낸다.</li>
<li><strong>레지스터</strong>: CPU 안의 가장 빠른 저장소. 다음 명령어 주소를 담은 <strong>PC</strong>(프로그램 카운터), 현재 명령어를 담은 <strong>IR</strong>(명령어 레지스터), 메모리에 보낼 주소의 <strong>MAR</strong>, 메모리와 주고받는 데이터의 <strong>MBR</strong>(MDR), 계산용 범용 레지스터, 스택 위치를 가리키는 스택 포인터 등이 있다.</li>
<li><strong>버스</strong>: 주소 버스(어디에), 데이터 버스(무엇을), 제어 버스(읽기/쓰기 등).</li>
</ul>
<h3>CPU 성능 방정식</h3>
<p>프로그램 실행 시간 = <strong>명령어 수 × 명령어당 평균 사이클(CPI) × 클럭 주기</strong>. 클럭(GHz)은 셋 중 하나일 뿐이다. 클럭이 높아도 CPI가 크면 느리고, 명령어 집합이나 컴파일러가 명령어 수를 바꾸기도 한다. 그래서 클럭 속도만으로 서로 다른 CPU를 비교할 수 없다.</p>
<h3>클럭이 멈추고 코어가 늘었다</h3>
<p>클럭을 올리면 전력과 발열이 급격히 늘어난다. 트랜지스터가 작아져도 전력 밀도가 유지되던 경향(데나드 스케일링)이 2000년대 중반에 무너지면서, 업계는 클럭 대신 <strong>코어 수</strong>를 늘리는 방향으로 전환했다. 이때부터 소프트웨어가 병렬로 짜여야 성능이 오르게 되었다. 한 코어가 두 개의 하드웨어 스레드를 번갈아 실행해 놀고 있는 실행 유닛을 채우는 SMT(인텔의 하이퍼스레딩)도 같은 맥락이다.</p>
<h3>ISA와 마이크로아키텍처</h3>
<p><strong>명령어 집합 구조(ISA)</strong>는 소프트웨어와 하드웨어 사이의 계약(어떤 명령어와 레지스터가 있는가)이고, <strong>마이크로아키텍처</strong>는 그 계약을 실제로 구현한 내부 설계다. 인텔과 AMD CPU는 내부 구조가 전혀 다르지만 같은 x86-64 ISA를 구현하므로 같은 프로그램이 돈다. <strong>CISC</strong>(x86: 가변 길이, 메모리를 직접 다루는 복잡한 명령어)와 <strong>RISC</strong>(ARM, RISC-V: 고정 길이, 메모리 접근은 load/store만)의 구분은 지금도 쓰이지만, 현대 x86 CPU는 내부적으로 복잡한 명령어를 단순한 마이크로 연산으로 쪼개 실행하므로 경계가 많이 흐려졌다.</p>`,

import os, platform

print("ISA:", platform.machine(), "/ 논리 코어 수:", os.cpu_count())

def cpu_time(ic, cpi, ghz):
    return ic * cpi / (ghz * 1e9)

# 같은 프로그램(10억 명령어)을 두 설계에서 실행
a = cpu_time(1e9, cpi=2.0, ghz=4.0)      # 클럭은 높지만 명령어당 사이클이 많음
b = cpu_time(1e9, cpi=1.2, ghz=3.0)      # 클럭은 낮지만 CPI가 작음
print(f"A(4GHz): {a:.3f}s, B(3GHz): {b:.3f}s → 클럭만으로는 비교할 수 없다")

# ALU: 같은 8비트 덧셈 결과를 부호 없는/부호 있는 수로 다르게 해석하고, 플래그로 상황을 알린다
def alu_add(a, b, bits=8):
    mask = (1 << bits) - 1
    raw = (a & mask) + (b & mask)
    r = raw & mask
    sign = lambda x: (x >> (bits - 1)) & 1
    flags = {"Z": r == 0,                                       # 결과가 0
             "N": sign(r) == 1,                                 # 최상위 비트 = 음수
             "C": raw > mask,                                   # 부호 없는 자리올림
             "V": sign(a) == sign(b) and sign(r) != sign(a)}    # 부호 있는 오버플로
    return r, {k for k, v in flags.items() if v}

for a, b in [(100, 27), (100, 28), (200, 100), (255, 1)]:
    r, f = alu_add(a, b)
    signed = r - 256 if r > 127 else r
    print(f"{a:3d} + {b:3d} = {r:3d} (부호 있는 해석 {signed:4d})  플래그 {sorted(f) or '-'}")

      body: R`
<h3>명령어 사이클</h3>
<ol>
<li><strong>인출(fetch)</strong>: PC가 가리키는 주소에서 명령어를 읽어 IR에 넣고, PC를 다음 명령어로 증가시킨다. 미리 증가시키므로, 분기가 없으면 자연스럽게 다음 명령어가 실행된다.</li>
<li><strong>해독(decode)</strong>: 명령어의 연산 코드(opcode)와 피연산자 필드를 해석해 무엇을 어디서 가져올지 정한다.</li>
<li><strong>실행(execute)</strong>: ALU 연산, 메모리 읽기·쓰기, 또는 분기(PC에 새 주소를 넣음). 메모리 접근과 결과 저장을 별도 단계로 나누기도 한다.</li>
<li><strong>인터럽트 확인</strong>: 사이클이 끝날 때 대기 중인 인터럽트가 있으면 현재 상태(PC 등)를 저장하고 인터럽트 핸들러로 간다. 그래서 인터럽트는 명령어 하나의 "중간"이 아니라 명령어 사이의 경계에서 처리된다.</li>
</ol>
<h3>고급 언어 한 줄 = 명령어 여러 개</h3>
<p><code>sum = sum + a[i]</code>는 대략 "i를 레지스터로 읽기 → a의 시작 주소 + i × 원소 크기 계산 → 그 주소에서 값 읽기 → sum 읽기 → 더하기 → sum에 쓰기"가 된다. <code>if</code>와 <code>for</code>는 비교 명령어와 조건 분기(플래그를 보고 PC를 바꿈)로, 함수 호출은 "돌아올 주소를 스택에 저장하고 PC를 함수 시작 주소로 바꾸는 것"으로 번역된다.</p>
<h3>명령어 형식</h3>
<p>명령어는 연산 코드와 0~3개의 피연산자 주소로 구성된다. <strong>3-주소</strong>(<code>ADD R1, R2, R3</code>), <strong>2-주소</strong>(결과를 피연산자 하나에 덮어씀), <strong>1-주소</strong>(누산기 하나를 암묵적으로 사용), <strong>0-주소</strong>(스택 꼭대기의 값들을 사용하는 스택 머신). 주소가 적을수록 명령어는 짧지만 같은 일을 하는 데 명령어가 더 많이 필요하다. 흥미롭게도 <strong>CPython과 JVM의 바이트코드는 스택 머신</strong>이다. <code>dis</code> 모듈로 보면 피연산자를 스택에 올리고(LOAD) 연산하는 0-주소 형식이다.</p>
<h3>주소 지정 방식: 피연산자를 어디서 찾나</h3>
<table><tr><th>방식</th><th>피연산자</th><th>대표 용도</th></tr>
<tr><td>즉시</td><td>명령어 안의 값 자체</td><td>상수 (<code>x + 1</code>의 1)</td></tr>
<tr><td>레지스터</td><td>레지스터의 값</td><td>가장 빠름, 대부분의 연산</td></tr>
<tr><td>직접</td><td>명령어에 적힌 메모리 주소의 값</td><td>전역 변수</td></tr>
<tr><td>간접</td><td>주소에 적힌 "또 다른 주소"의 값</td><td>포인터 따라가기</td></tr>
<tr><td>레지스터 간접</td><td>레지스터가 가리키는 주소의 값</td><td>포인터, 참조</td></tr>
<tr><td>변위(베이스+오프셋)</td><td>레지스터 값 + 상수 주소의 값</td><td>배열 원소, 구조체 필드, 스택의 지역 변수</td></tr>
<tr><td>상대(PC+오프셋)</td><td>PC 기준 위치</td><td>분기 — 코드가 메모리 어디에 올라가도 동작</td></tr></table>
<p>RISC 계열은 메모리 접근을 load/store 명령어에만 허용하고, 연산은 레지스터끼리만 한다. 명령어 형식이 단순하고 길이가 일정해 파이프라인 설계가 쉬워진다.</p>`,

import dis

# 장난감 누산기 CPU: 프로그램과 데이터가 같은 메모리에 있다(폰 노이만)

    ("STORE", 20),    # 1: M[20] ← ACC      sum = 0
    ("LOAD_I", 5),    # 2: ACC ← 5
    ("STORE", 21),    # 3: M[21] ← ACC      i = 5
    ("LOAD", 20),     # 4: ACC ← M[20]      (직접 주소 지정) ← 루프 시작
    ("ADD", 21),      # 5: ACC ← ACC + M[21]
    ("STORE", 20),    # 6: sum ← ACC
    ("LOAD", 21),     # 7: ACC ← i
    ("SUB_I", 1),     # 8: ACC ← ACC - 1
    ("STORE", 21),    # 9: i ← ACC
    ("JNZ", 4),       # 10: ACC ≠ 0 이면 PC ← 4 (분기 = PC 덮어쓰기)
    ("HALT", 0),      # 11
] + [0] * 10          # 12~21: 데이터 영역

pc, acc, executed = 0, 0, 0
while True:
    op, x = mem[pc]                       # 인출: IR ← M[PC]
    pc += 1                               #       PC ← PC + 1
    executed += 1
    if op == "LOAD_I":   acc = x          # 해독 + 실행
    elif op == "LOAD":   acc = mem[x]
    elif op == "STORE":  mem[x] = acc
    elif op == "ADD":    acc += mem[x]
    elif op == "SUB_I":  acc -= x
    elif op == "JNZ":    pc = x if acc != 0 else pc
    elif op == "HALT":   break
print(f"sum(1..5) = {mem[20]}, 실행한 명령어 {executed}개")

# CPython도 0-주소 스택 머신의 명령어(바이트코드)로 컴파일된다
def f(a, b):
    return a + b * 2
dis.dis(f)            # LOAD_FAST로 스택에 올리고, BINARY_OP가 스택 위 두 값을 계산

      body: R`
<h3>아이디어: 세탁기와 건조기</h3>
<p>고전적인 5단계 파이프라인은 IF(인출) → ID(해독·레지스터 읽기) → EX(실행) → MEM(메모리 접근) → WB(결과 저장)이다. 첫 명령어가 ID 단계로 넘어가면 IF 단계는 놀고 있으니 다음 명령어를 인출한다. 파이프라인이 꽉 차면 <strong>매 사이클 명령어 하나가 완료</strong>되어 이상적으로 CPI = 1이 된다.</p>
<ul>
<li><strong>처리량</strong>은 최대 단계 수만큼 좋아지지만, 명령어 하나가 처음부터 끝까지 걸리는 <strong>지연 시간</strong>은 줄지 않는다(단계 사이 레지스터 때문에 약간 늘기도 한다).</li>
<li>클럭은 <strong>가장 느린 단계</strong>에 맞춰야 하므로 단계들의 작업량이 고르게 나뉘어야 한다.</li>
<li>단계를 더 잘게 쪼개면(깊은 파이프라인) 클럭을 높일 수 있지만, 아래 해저드의 비용이 커진다.</li>
</ul>
<h3>해저드: 겹침을 방해하는 것들</h3>
<ul>
<li><strong>구조적 해저드</strong>: 두 명령어가 같은 하드웨어를 동시에 쓰려는 충돌. 예: 한 명령어의 IF와 다른 명령어의 MEM이 같은 메모리 포트를 원함 → 명령어 캐시와 데이터 캐시를 분리해 해결.</li>
<li><strong>데이터 해저드</strong>: <code>ADD R1, R2, R3</code> 바로 다음에 <code>SUB R4, R1, R5</code>처럼 앞 명령어의 결과(R1)가 레지스터에 기록되기 전에 뒤 명령어가 필요로 하는 경우(RAW). EX 단계의 결과를 레지스터를 거치지 않고 다음 명령어의 EX 입력으로 바로 넘기는 <strong>포워딩(바이패싱)</strong>으로 대부분 해결된다. 단, 메모리에서 읽어 온 값을 바로 다음 명령어가 쓰는 경우(load-use)는 값이 MEM 단계 끝에야 나오므로 한 사이클을 쉬어야(stall) 한다. 컴파일러는 독립적인 명령어를 그 사이에 끼워 넣어 이를 줄인다.</li>
<li><strong>제어 해저드</strong>: 조건 분기의 결과(어디로 갈지)는 EX 단계쯤에야 알 수 있는데, 그동안 다음 명령어를 무엇으로 인출할지 정해야 한다. 기다리면 매 분기마다 여러 사이클을 잃는다.</li>
</ul>
<h3>분기 예측</h3>
<p>그래서 CPU는 분기 결과를 <strong>예측</strong>하고 그 방향으로 계속 인출·실행한다(투기적 실행). 맞으면 손실이 없고, 틀리면 잘못 들어온 명령어들을 버리고(flush) 올바른 주소부터 다시 시작한다. 이 손실은 파이프라인 깊이에 비례한다. 동적 예측기는 각 분기의 과거 기록(예: 2비트 포화 카운터, 다른 분기들의 결과 패턴)으로 예측하며, 현대 CPU의 예측 정확도는 일반적인 코드에서 매우 높다. 반대로 <strong>무작위 데이터에 따라 갈리는 분기</strong>는 예측할 수 없어 비싸다. C/C++에서 "정렬된 배열에 대해 if문 루프가 훨씬 빠르다"는 유명한 사례가 이 때문이다. Python에서는 인터프리터 자체의 오버헤드가 커서 이 효과가 잘 드러나지 않는다.</p>

<p>현대 CPU는 매 사이클 여러 명령어를 동시에 인출·실행하고(슈퍼스칼라, CPI &lt; 1), 데이터가 준비된 명령어부터 순서를 바꿔 실행한 뒤 결과만 원래 순서대로 확정한다(비순차 실행). 캐시 미스로 기다리는 명령어가 있어도 뒤의 독립적인 명령어를 먼저 처리해 시간을 채운다. 투기적 실행이 남긴 캐시 흔적을 이용한 Spectre 같은 보안 취약점도 이 구조에서 나왔다.</p>`,
